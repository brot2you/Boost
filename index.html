<style>
:root{
  --bg:#eceeff; --dot:rgba(29,26,58,.09); --surface:#ffffff; --surface2:#f3f2ff; --ink:#1d1a3a; --muted:#5b5878; --line:#d8d6f0; --edge:#1d1a3a;
  --bezel:#1d1a3a; --jl:#ff4554; --jr:#00c3e3; --ok:#14b86a; --warn:#ffb020; --sun:#ffd23f;
  --a1:#6c5ce7; --a2:#a66cff;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Lexend","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --sh:0 4px 0 var(--edge); --sh-s:0 3px 0 var(--edge);
  --sticker:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 0 rgba(20,16,50,.28));
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#17152e; --dot:rgba(255,255,255,.06); --surface:#262347; --surface2:#1f1c3d; --ink:#f5f3ff; --muted:#bab6dd; --line:#3a3669; --edge:#06051a; --bezel:#0b0a1c;
    --sticker:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 0 rgba(0,0,0,.5));
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#17152e; --dot:rgba(255,255,255,.06); --surface:#262347; --surface2:#1f1c3d; --ink:#f5f3ff; --muted:#bab6dd; --line:#3a3669; --edge:#06051a; --bezel:#0b0a1c;
  --sticker:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 4px 0 rgba(0,0,0,.5));
}
*,*:before,*:after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bezel);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-tap-highlight-color:transparent;overflow:hidden}
body.spacing{letter-spacing:.03em;word-spacing:.14em;line-height:1.8}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--jr);outline-offset:3px}
img{max-width:100%}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Coque de la console ---------- */
.shell{height:100%;display:flex;align-items:stretch;justify-content:center}
.grip{display:none}
.screen{flex:1;min-width:0;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden;
  background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.8px);background-size:22px 22px;
  border-left:6px solid var(--jl);border-right:6px solid var(--jr)}
@media (min-width:900px){
  .shell{padding:20px 0}
  .grip{display:flex;flex-direction:column;align-items:center;justify-content:space-around;width:100px;flex:0 0 100px;padding:34px 0;position:relative}
  .grip.l{background:linear-gradient(100deg,var(--jl) 55%,rgba(0,0,0,.18)),var(--jl);border-radius:50px 0 0 50px;box-shadow:inset 6px 0 0 rgba(255,255,255,.25)}
  .grip.r{background:linear-gradient(260deg,var(--jr) 55%,rgba(0,0,0,.18)),var(--jr);border-radius:0 50px 50px 0;box-shadow:inset -6px 0 0 rgba(255,255,255,.25)}
  .screen{max-width:1120px;border:14px solid #0f0d22;border-radius:8px;flex:0 1 1120px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.04)}
  .stick{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4a4760,#1c1a2c 70%);box-shadow:0 5px 0 rgba(0,0,0,.35),inset 0 -4px 0 rgba(0,0,0,.4)}
  .pad{width:80px;height:80px;position:relative}
  .pad span{position:absolute;width:26px;height:26px;border-radius:50%;background:#1f1d30;box-shadow:0 3px 0 rgba(0,0,0,.4);color:#d8d6ea;font:700 11px/26px var(--display);text-align:center}
  .pad span:nth-child(1){left:27px;top:0}.pad span:nth-child(2){left:54px;top:27px}.pad span:nth-child(3){left:27px;top:54px}.pad span:nth-child(4){left:0;top:27px}
  .mini{width:22px;height:7px;border-radius:4px;background:#1f1d30}
  .home-btn{width:24px;height:24px;border-radius:50%;background:#1f1d30;border:3px solid rgba(255,255,255,.4)}
  .sq{width:22px;height:22px;border-radius:6px;background:#1f1d30}
}
@media (max-width:899px){ .screen{border-width:0 5px} }

/* ---------- HUD ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 20px 6px;flex:0 0 auto}
.me{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;min-width:0}
.avw{position:relative;flex:0 0 auto}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:var(--surface);border:3px solid var(--edge);box-shadow:0 0 0 3px var(--jr);flex:0 0 auto}
.lvb{position:absolute;right:-8px;bottom:-6px;min-width:26px;height:26px;border-radius:13px;padding:0 6px;background:var(--sun);color:#1d1a3a;border:2.5px solid var(--edge);font:700 .8rem/21px var(--display);text-align:center}
.me b{font:700 1.2rem/1.1 var(--display);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{color:var(--muted);font:600 .82rem var(--display)}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:5px 12px 5px 9px;font:700 1rem var(--display);border:2.5px solid var(--edge);box-shadow:var(--sh-s);white-space:nowrap}
.clock{font:600 1.05rem var(--display);color:var(--muted);min-width:48px;text-align:right}
.xpwrap{padding:4px 20px 6px}
.xpbar{height:20px;border-radius:12px;background:var(--surface2);border:3px solid var(--edge);overflow:hidden;position:relative}
.xpbar i{display:block;height:100%;border-radius:0 8px 8px 0;transition:width .6s;
  background:repeating-linear-gradient(-45deg,rgba(255,255,255,.3) 0 8px,transparent 8px 16px),linear-gradient(90deg,#ffc21a,#ff8a1f);background-size:22.6px 22.6px,100% 100%;animation:stripes 1.2s linear infinite}
@keyframes stripes{to{background-position:22.6px 0,0 0}}
.xptxt{display:flex;justify-content:space-between;gap:10px;font:600 .8rem var(--display);color:var(--muted);margin-top:4px}

.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:8px 20px 30px}

/* ---------- Avatars dessinés ---------- */
.av{overflow:hidden;padding:0}
.av .avs,.pick .avs{width:100%;height:100%;display:block}
.av.mini{display:inline-block;width:24px;height:24px;border-width:2px;box-shadow:none;vertical-align:middle;margin-right:6px}
.pick{overflow:hidden}
.pick .avs{transition:transform .15s}
.pick:hover .avs{transform:scale(1.08) rotate(-4deg)}
.pick.lock{opacity:1;overflow:visible}
.pick.lock .avs{filter:grayscale(1) brightness(1.1);opacity:.35;border-radius:50%}
.pick .lk{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink)}
.pick .lk .ico{width:26px;height:26px;stroke-width:2.4}
.framepick .av{width:56px;height:56px}
.pr-av .avs{width:64px;height:64px;border-radius:50%;border:2px solid #222}

/* ---------- Mode DYS ---------- */
body.dys-f-opendys{--body:"OpenDyslexic","Lexend",system-ui,sans-serif;--display:"OpenDyslexic","Lexend",system-ui,sans-serif}
body.dys-f-andika{--body:"Andika","Lexend",system-ui,sans-serif;--display:"Andika","Fredoka",system-ui,sans-serif}
body.dys-f-lexend{--display:"Lexend",system-ui,sans-serif}
body.dys-f-opendys .content,body.dys-f-opendys .box{font-size:.94em}
body.dys-s1 .content,body.dys-s1 .box,body.dys-s1 .toast{letter-spacing:.05em;word-spacing:.16em}
body.dys-s2 .content,body.dys-s2 .box,body.dys-s2 .toast{letter-spacing:.1em;word-spacing:.32em}
body.dys-l1 .content,body.dys-l1 .box{line-height:1.75}
body.dys-l2 .content,body.dys-l2 .box{line-height:2.05}
body.dys-l1 .content p,body.dys-l2 .content p,body.dys-l1 .box p,body.dys-l2 .box p{margin-bottom:.9em}
body.dys em,body.dys i:not([class]){font-style:normal}
body.dys .content,body.dys .box{text-align:left;hyphens:none;-webkit-hyphens:none}
body.dys .lead,body.dys .note,body.dys small{color:var(--ink)}
body.dys .lead{max-width:56ch}
#dysov{position:fixed;inset:0;z-index:80;pointer-events:none;mix-blend-mode:multiply;opacity:0;transition:opacity .2s}
#dysov.on{opacity:.38}
:root[data-theme="dark"] #dysov.on{mix-blend-mode:soft-light;opacity:.5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #dysov.on{mix-blend-mode:soft-light;opacity:.5}}
#dysruler{position:fixed;inset:0;z-index:79;pointer-events:none;display:none}
#dysruler.on{display:block}
#dysruler i{position:absolute;left:0;right:0;background:rgba(10,8,30,.42)}
#dysruler .rt{top:0}
#dysruler .rb{bottom:0}
#dysruler .band{position:absolute;left:0;right:0;border-top:3px solid var(--jr);border-bottom:3px solid var(--jr)}
.sy0{color:#1d4ed8}.sy1{color:#d9480f}
:root[data-theme="dark"] .sy0{color:#7cb4ff}:root[data-theme="dark"] .sy1{color:#ffa463}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sy0{color:#7cb4ff}:root:not([data-theme="light"]) .sy1{color:#ffa463}}
.tile .sy0,.tile .sy1,.bigcard .sy0,.bigcard .sy1,.btn .sy0,.btn .sy1,.subhead .sy0,.subhead .sy1,.toast .sy0,.toast .sy1,.inbox .sy0,.inbox .sy1,.chip.sel .sy0,.chip.sel .sy1,.step.next .sy0,.step.next .sy1{color:inherit}
.tile .sy1,.bigcard .sy1,.btn .sy1,.subhead .sy1{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.bio{display:inline!important;font-weight:700!important;font-size:inherit!important;font-family:inherit!important;color:inherit}
.ptag{white-space:nowrap}
.dysgrid.fontgrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.dysread{outline:3px dashed var(--jr);outline-offset:3px;border-radius:6px}
body.dys-tap .content p,body.dys-tap .content li,body.dys-tap .lead,body.dys-tap .bubble,body.dys-tap .note,body.dys-tap .save span,body.dys-tap .content h2{cursor:pointer}
.dysprev{background:var(--surface);border:2.5px solid var(--edge);border-radius:16px;padding:14px 16px;margin:10px 0 4px;font-size:1.05rem}
.dysgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ovpick{border:2.5px solid var(--edge);border-radius:14px;padding:10px 6px;font:600 .85rem var(--display);box-shadow:var(--sh-s);color:#1d1a3a}
.ovpick.sel{outline:3px solid var(--jr);outline-offset:3px}
.ovpick .ico{width:14px;height:14px;stroke-width:3}
.fontpick{border:2.5px solid var(--edge);border-radius:14px;padding:10px;background:var(--surface);box-shadow:var(--sh-s);text-align:left}
.fontpick b{display:block;font-size:1.15rem}
.fontpick small{color:var(--muted)}
.fontpick.sel{background:var(--sun);color:#1d1a3a}
.fontpick.sel small{color:#4a4520}

/* ---------- Icônes et illustrations partout (zéro emoji) ---------- */
.ill{width:1.2em;height:1.2em;flex:0 0 auto;vertical-align:-.25em;overflow:visible}
.e > .ico,.e > .ill,.ic > .ico,.ic > .ill,.medal > .ico,.medal > .ill{width:1em;height:1em;vertical-align:middle}
.need .e,.mission .ic,.skill .e,.moodb .e{line-height:1;display:inline-block}
.need .e{background:#fff;border:2.5px solid var(--edge);border-radius:14px;padding:7px;font-size:30px!important;filter:none!important;transform:rotate(-4deg)}
.need .e .ico{stroke-width:2.2;color:#1d1a3a}
body.pictos .need .e{font-size:44px!important}
.mission .ic{font-size:30px;color:var(--ink)}
.mission .ic .ico,.skill .e .ico{stroke-width:2.1}
.skill .e{font-size:28px;color:var(--ink)}
.rowi{font-size:24px;line-height:0;color:var(--ink)}
.chip .ico,.chip .ill{width:1.25em;height:1.25em;margin-right:2px}
.gi{color:#00a3d9;width:1.05em;height:1.05em;vertical-align:-.18em;stroke-width:2.4}
.toast{display:flex;align-items:center;gap:8px}
.toast > .ico,.toast > .ill{width:22px;height:22px;stroke-width:2.4}
.toast.gold > .ico{color:#b45309}
.burst i{line-height:0}
.burst .bf{width:22px;height:22px;fill:currentColor;stroke:var(--edge);stroke-width:1.4}
h2 .h2i,.box h2 .h2i{width:1.1em;height:1.1em;margin-right:8px;vertical-align:-.2em;color:var(--jr);stroke-width:2.4}
.medal{color:var(--jr)}
.lvl .medal .ico{stroke-width:2}
.chest .ico{width:34px;height:34px;stroke-width:2.2;color:#c2410c;animation:pop .6s .2s both}
.ul{display:flex;align-items:center;gap:8px;margin-top:4px}
.ul .ico,.ul .ill{width:22px;height:22px;color:var(--jr)}
.uls .ico{width:14px;height:14px;vertical-align:-2px;color:var(--jr)}
.step small .ico{width:14px;height:14px;vertical-align:-2px}
.step .n .ico{width:20px;height:20px;stroke-width:3}
.stepchk .bx .ico{width:18px;height:18px;stroke-width:3}
.btn.ok .ico{stroke-width:3}
.ptag .ico{width:11px;height:11px;stroke-width:3.4;vertical-align:-1px;margin-right:2px}
.planline .ico{width:16px;height:16px;vertical-align:-3px}
.bigcard .e .ico{stroke-width:1.8;color:#fff}
.bigcard.pride .e .ico{color:#fff}
.reward .e{color:var(--ink)}
.reward .e .ico,.reward .e .ill{width:36px;height:36px}
.reward .e .ico{stroke-width:2}
.trophy .e{color:#1d1a3a}
.trophy .e .ico{width:28px;height:28px;stroke-width:2.2}
.trophy .e .ill{width:44px;height:44px}
.trophy.lock .e{color:var(--muted)}
.moodb .e{font-size:56px}
.moodb .e .ico{stroke-width:1.9}
.mood-soleil{color:#f59e0b}.mood-nuage{color:#64748b}.mood-pluie{color:#2b86e0}.mood-orage{color:#7c3aed}
.week span{display:block;font-size:24px;line-height:1;height:26px}
.week .ico{stroke-width:2.2}
.week .nod{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line);margin-top:10px}
.today .ico{width:1em;height:1em}
.g1{color:#84cc16}.g2{color:#22a34a}.g3{color:#15803d}.g4{color:#0e7490}
.jr{display:inline-flex;align-items:center;gap:4px;font-size:1.4rem}
.jr .arr{width:12px;height:12px;color:var(--muted)}
.rlab{color:var(--ink)}
.evo{display:flex;justify-content:space-between;align-items:flex-end;gap:2px;margin-bottom:8px;width:100%}
.evo .ill{width:calc((100% - 6px) / 4);height:auto;aspect-ratio:1/1;max-width:52px}
.stage .pet .body{line-height:0}
.stage .pet .body .ill{width:1em;height:1em}
.stage .pet .hat{line-height:0;transform:none;font-size:1em}
.stage .pet .hat .ill{width:.5em;height:.5em}
.stage .pet .obj{right:-.3em;bottom:0;line-height:0;font-size:1em}
.stage .pet .obj .ill{width:.45em;height:.45em}
.hints .ico{width:14px;height:14px;margin-right:1px}
.pad svg{width:12px;height:12px;vertical-align:-1px}
.keypad .ico{width:24px;height:24px}
.nx .ico{width:16px;height:16px;vertical-align:-3px}
.tile .bdg .ico{width:13px;height:13px;stroke-width:3;vertical-align:-2px}
.xptxt .ico{width:14px;height:14px;vertical-align:-2px}
#print .ico,#print .ill{width:14px;height:14px;vertical-align:-2px}
#print td.c .ico{width:16px;height:16px}
body.pictos .need .e{font-size:52px}
body.pictos .mission .ic{font-size:40px}
body.pictos .skill .e{font-size:36px}

/* ---------- Icônes ---------- */
.ico{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:-.22em;overflow:visible}
.ico .f{fill:currentColor;stroke:none}
.rbtn .c .ico{width:32px;height:32px;stroke-width:2.6}
.pill .ico{width:20px;height:20px;stroke-width:2.2}
.pill.gem .ico{color:#00a3d9}
.pill.fire .ico{color:#ff6a00}
.icon-btn .ico{width:20px;height:20px;stroke-width:2.3}
.backbtn .ico{width:17px;height:17px;stroke-width:3;margin-left:-2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn .ico{width:19px;height:19px;stroke-width:2.4}
.season .ico{width:24px;height:24px;color:var(--jl);stroke-width:2.2}
.inbox .ico{width:26px;height:26px;stroke-width:2.2}
#tmini .ico{width:18px;height:18px}
.tile .bdg .ico{width:14px;height:14px;color:#00a3d9;stroke-width:2.6;vertical-align:-2px}

/* ---------- Accueil ---------- */
.homerow{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;margin:6px 0 4px}
.homerow .homepet{flex:1 1 360px}
.season{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:14px;background:var(--surface);border:2.5px solid var(--edge);font:600 .88rem var(--display);flex:0 1 auto}
.season b{font-weight:700}
.inbox{display:flex;align-items:center;gap:10px;width:100%;margin:10px 0 2px;padding:12px 16px;border-radius:16px;border:3px solid var(--edge);background:var(--sun);color:#1d1a3a;text-align:left;font:700 1rem var(--display);box-shadow:var(--sh);animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{0%,80%,100%{transform:none}85%{transform:rotate(-1.2deg)}90%{transform:rotate(1.2deg)}}
.tile-title{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(138px,auto);gap:16px;padding:14px 2px 8px}
.tile{position:relative;border-radius:22px;border:3px solid var(--edge);padding:0;overflow:hidden;color:#fff;text-align:left;
  background:radial-gradient(rgba(255,255,255,.2) 1.6px,transparent 2.2px) 0 0/15px 15px,linear-gradient(150deg,var(--t1),var(--t2));
  box-shadow:0 6px 0 var(--edge);transition:transform .15s,box-shadow .15s}
.tile:first-child{grid-column:span 2;grid-row:span 2}
.tile .art{position:absolute;right:9%;top:50%;transform:translateY(-58%);line-height:0;transition:transform .2s}
.tile .art .ico{width:clamp(48px,5.6vw,66px);height:clamp(48px,5.6vw,66px);color:#fff;stroke-width:2.1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
.tile:first-child .art{right:11%}
.tile:first-child .art .ico{width:clamp(84px,11vw,136px);height:clamp(84px,11vw,136px);stroke-width:1.8}
.tile:before{content:"";position:absolute;width:70%;aspect-ratio:1;right:-14%;top:-30%;border-radius:50%;background:rgba(255,255,255,.16)}
.tile .nm{position:absolute;left:14px;bottom:12px;right:14px;font:700 1.08rem/1.15 var(--display);text-shadow:0 2px 0 rgba(0,0,0,.28)}
.tile:first-child .nm{font-size:clamp(1.5rem,2.6vw,2.1rem);bottom:18px;left:20px;right:auto;max-width:62%}
.tile .nx{display:block;font:500 .88rem/1.3 var(--body);text-shadow:none;margin-top:6px;background:rgba(0,0,0,.22);border-radius:12px;padding:6px 10px}
@media (max-width:640px){.tile .nx{display:none}}
.tile .bdg{position:absolute;top:10px;left:12px;background:#fff;color:#1d1a3a;border:2.5px solid var(--edge);border-radius:999px;padding:1px 10px;font:700 .8rem var(--display)}
.tile:first-child .bdg{font-size:.95rem;padding:3px 12px;top:16px;left:18px}
.tile:hover,.tile.on{transform:translateY(-4px);box-shadow:0 10px 0 var(--edge)}
.tile:hover .art,.tile.on .art{transform:translateY(-62%) scale(1.08)}
.tile.on,.tile:focus-visible{outline:4px solid var(--jr);outline-offset:4px}
.tile:active{transform:translateY(3px);box-shadow:0 3px 0 var(--edge)}
.rbtns{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:20px 0 4px}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;padding:0;width:80px}
.rbtn .c{width:60px;height:60px;border-radius:50%;background:var(--surface);color:var(--rc,var(--ink));display:grid;place-items:center;border:3px solid var(--edge);box-shadow:var(--sh);transition:transform .12s}
.rbtn:hover .c{transform:translateY(-2px)}
.rbtn:active .c{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.rbtn span:last-child{font:600 .78rem/1.2 var(--display);color:var(--muted);text-align:center}
.rbtn.on .c{background:var(--sun)}
.rbtn.on .c,.rbtn:focus-visible .c{outline:3px solid var(--jr);outline-offset:3px}
.rbtn:focus-visible{outline:none}
.hints{display:none;justify-content:flex-end;gap:18px;padding:8px 20px 10px;border-top:2px solid var(--line);color:var(--muted);font:600 .82rem var(--display);flex:0 0 auto;background:var(--bg)}
.hints b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 .75rem var(--display);margin-right:6px}
@media (min-width:900px){.hints{display:flex}}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.today div{background:var(--surface);border-radius:16px;padding:10px 14px;border:2.5px solid var(--edge);box-shadow:var(--sh-s)}
.today b{font:700 1.5rem var(--display);display:block}
.today span{font-size:.8rem;color:var(--muted)}
@media (max-width:640px){
  .tiles{grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(118px,auto);gap:12px}
  .tile:first-child{grid-row:span 1;min-height:150px}
  .tile .art{font-size:46px}
  .tile:first-child .art{font-size:76px}
  .topbar{flex-wrap:wrap}
  .clock{display:none}
  .today{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .today div{padding:8px 10px}
}

/* ---------- Sous-écrans ---------- */
.subhead{display:flex;align-items:center;gap:10px;padding:14px 16px;flex:0 0 auto;color:#fff;border-bottom:3px solid var(--edge);
  background:radial-gradient(rgba(255,255,255,.18) 1.6px,transparent 2.2px) 0 0/15px 15px,linear-gradient(120deg,var(--a1),var(--a2))}
.backbtn{display:flex;align-items:center;gap:6px;background:#fff;color:#1d1a3a;border:2.5px solid var(--edge);border-radius:999px;padding:6px 14px 6px 10px;font:700 .92rem var(--display);box-shadow:var(--sh-s);flex:0 0 auto}
.backbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.subhead h1{font:700 1.55rem var(--display);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.subhead .h1e{display:inline-block;margin-right:10px;vertical-align:-4px;line-height:0}
.subhead .h1e .ico{width:30px;height:30px;stroke-width:2.4;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.subhead .pill{color:#1d1a3a;background:#fff}
.subhead .icon-btn{background:#fff;color:#1d1a3a}
.lead{color:var(--muted);margin:16px 0 18px;max-width:64ch;font-size:1rem}
h2{font:700 1.25rem var(--display);margin:24px 0 10px}
.card{background:var(--surface);border:2.5px solid var(--edge);border-radius:var(--r);padding:14px}
.row{display:flex;align-items:center;gap:12px}
.list{display:flex;flex-direction:column;gap:10px}
.mission{display:flex;align-items:center;gap:12px;background:var(--surface);border:2.5px solid var(--edge);border-radius:var(--r);padding:12px;box-shadow:var(--sh-s);position:relative;overflow:hidden}
.mission:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--jr)}
.mission.done{background:var(--surface2)}
.mission.done .tx b{color:var(--muted)}
.mission.done:before{background:var(--ok)}
.mission.prof:before{background:var(--warn)}
.mission .ic{font-size:30px;flex:0 0 auto;margin-left:6px}
.mission .tx{flex:1;min-width:0}
.mission .tx b{display:block;font-weight:500}
.mission .tx small{color:var(--muted)}
.btn{border:2.5px solid var(--edge);border-radius:999px;padding:9px 18px;font:700 .98rem var(--display);background:var(--jr);color:#fff;white-space:nowrap;box-shadow:var(--sh);text-shadow:0 1px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn.l{background:var(--jl)}
.btn.ghost{background:var(--surface);color:var(--ink);text-shadow:none}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.6;cursor:default;transform:none;box-shadow:0 2px 0 var(--edge)}
.icon-btn{background:var(--surface);border:2.5px solid var(--edge);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;font-size:17px;flex:0 0 auto;padding:0;box-shadow:var(--sh-s)}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:2.5px solid var(--edge);border-radius:999px;padding:7px 14px;font:500 .9rem var(--body);text-align:left;box-shadow:var(--sh-s)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.chip.sel{background:var(--sun);color:#1d1a3a;font-weight:600}
.field{width:100%;padding:12px 14px;border-radius:14px;border:2.5px solid var(--edge);background:var(--surface);font-size:1rem}
.field:focus{outline:3px solid var(--jr);outline-offset:1px}
textarea.field{min-height:90px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.need{--n:#ffe3e6;border-radius:20px;padding:14px 12px;min-height:124px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;
  background:var(--n);color:#1d1a3a;border:2.5px solid var(--edge);position:relative;box-shadow:var(--sh);transition:transform .1s}
.need:nth-child(6n+2){--n:#d8f5ff}.need:nth-child(6n+3){--n:#fff2c6}.need:nth-child(6n+4){--n:#e5ddff}.need:nth-child(6n+5){--n:#d9f7e6}.need:nth-child(6n+6){--n:#ffe2cc}
.need:hover{transform:translateY(-2px) rotate(-.6deg)}
.need:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.need .e{font-size:36px;align-self:flex-start;transform:rotate(-6deg)}
.need b{font:700 1.02rem/1.2 var(--display)}
.skill{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:2.5px solid var(--edge);border-radius:var(--r);padding:12px;text-align:left;box-shadow:var(--sh-s)}
.skill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.skill .e{font-size:28px}
.skill .tx{flex:1}
.skill small{display:block;color:var(--muted);font-size:.8rem}
.bars{display:flex;gap:4px;align-items:flex-end}
.bars i{width:11px;border-radius:3px;background:var(--line);border:2px solid var(--edge)}
.bars i:nth-child(1){height:12px}.bars i:nth-child(2){height:18px}.bars i:nth-child(3){height:24px}.bars i:nth-child(4){height:30px}
.bars i.f{background:linear-gradient(var(--jr),var(--jl))}
.save{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:2.5px solid var(--edge);border-radius:var(--r);padding:12px}
.save .dt{font:700 .8rem var(--display);color:#fff;background:var(--jl);border:2px solid var(--edge);border-radius:10px;padding:6px 8px;text-align:center;min-width:56px;line-height:1.15;transform:rotate(-3deg)}
.reward{display:flex;align-items:center;gap:12px;background:var(--surface);border:2.5px solid var(--edge);border-radius:var(--r);padding:12px;box-shadow:var(--sh-s)}
.reward .e{font-size:30px;width:56px;height:56px;border-radius:14px;background:var(--surface2);border:2.5px solid var(--edge);display:grid;place-items:center;flex:0 0 auto}
.reward .tx{flex:1;min-width:0}
.reward b{font:700 1.02rem var(--display)}
.reward small{color:var(--muted)}
.lockgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:12px}
.pick{aspect-ratio:1/1;border-radius:50%;border:2.5px solid var(--edge);background:var(--surface);font-size:34px;display:grid;place-items:center;position:relative;padding:0;box-shadow:var(--sh-s)}
.pick.sel{background:var(--sun);outline:3px solid var(--jr);outline-offset:3px}
.pick.lock{opacity:.45;font-size:24px;box-shadow:none}
.pick .lv{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:700 .66rem var(--display);padding:1px 7px;border-radius:999px;white-space:nowrap}
.consoles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.cons{border:2.5px solid var(--edge);border-radius:var(--r);background:var(--surface);padding:10px;text-align:left;position:relative;box-shadow:var(--sh-s)}
.cons.sel{background:var(--sun);color:#1d1a3a}
.cons.sel small{color:#4a4520}
.cons.lock{opacity:.5;box-shadow:none}
.cons .mock{display:flex;height:46px;border-radius:12px;overflow:hidden;margin-bottom:8px;border:2.5px solid var(--edge)}
.cons .mock i{flex:0 0 22%}
.cons .mock em{flex:1;background:#24213d}
.cons b{font:700 .95rem var(--display);display:block}
.cons small{color:var(--muted);font-size:.76rem}
.trophy{display:flex;gap:12px;align-items:center;background:var(--surface);border:2.5px solid var(--edge);border-radius:var(--r);padding:12px}
.trophy .e{font-size:30px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--sun);border:2.5px solid var(--edge);flex:0 0 auto;box-shadow:var(--sh-s)}
.trophy b{font:700 1rem var(--display)}
.trophy.lock{border-style:dashed;background:transparent}
.trophy.lock .e{background:var(--surface2);filter:grayscale(1);opacity:.5;box-shadow:none}
.trophy.lock b{color:var(--muted)}
.trophy small{color:var(--muted);display:block}
.moods{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.moodb{border:2.5px solid var(--edge);background:var(--surface);border-radius:22px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font:700 1rem var(--display);box-shadow:var(--sh)}
.moodb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.moodb .e{font-size:50px}
.moodb.sel{background:var(--sun);color:#1d1a3a}
.week{display:flex;gap:8px;flex-wrap:wrap}
.week div{width:54px;text-align:center;background:var(--surface);border:2.5px solid var(--edge);border-radius:14px;padding:6px 0;font:600 .72rem var(--display);color:var(--muted)}
.week span{display:block;font-size:22px}
.seg{display:flex;background:var(--surface2);border:2.5px solid var(--edge);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 10px;font:700 .92rem var(--display)}
.seg button.sel{background:var(--jr);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:2px dashed var(--line)}
.sw{width:58px;height:34px;border-radius:17px;background:var(--line);border:2.5px solid var(--edge);position:relative;flex:0 0 auto;padding:0}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;border:2.5px solid var(--edge);transition:left .2s}
.sw.on{background:var(--ok)}
.sw.on:after{left:25px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat3 div{background:var(--surface);border:2.5px solid var(--edge);border-radius:var(--r);padding:10px;text-align:center;box-shadow:var(--sh-s)}
.stat3 b{font:700 1.8rem var(--display);display:block;color:var(--jr);-webkit-text-stroke:1px var(--edge)}
.stat3 span{font-size:.76rem;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.note{font-size:.84rem;color:var(--muted);margin-top:8px}
.danger{color:#e23b4a}
.hidden{display:none!important}

/* ---------- Profils ---------- */
.who{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow-y:auto}
.wlogo{display:flex;align-items:center;gap:8px;font:700 2.6rem var(--display);color:var(--ink);margin-bottom:6px}
.wlogo i{display:block;width:22px;height:50px;border-radius:11px;border:3px solid var(--edge)}
.wlogo i.a{background:var(--jl)}.wlogo i.b{background:var(--jr)}
.who h1{font:700 1.6rem var(--display);margin:0 0 34px;color:var(--muted)}
.users{display:flex;flex-wrap:wrap;justify-content:center;gap:26px;max-width:760px}
.user{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:104px;padding:0}
.user .av{width:96px;height:96px;font-size:50px;border-width:3px;box-shadow:0 0 0 4px var(--jr),0 7px 0 4px var(--edge);transition:transform .15s}
.user:hover .av{transform:translateY(-4px) rotate(-3deg)}
.user span{font:700 1rem var(--display);max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user small{color:var(--muted);font:600 .78rem var(--display)}
.user.add .av{border-style:dashed;font-size:38px;color:var(--muted);box-shadow:none;background:transparent}
.user:focus-visible{outline:none}.user:focus-visible .av{outline:4px solid var(--jr);outline-offset:6px}

/* ---------- Démarrage ---------- */
.boot{position:fixed;inset:0;z-index:50;background:#141230;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;color:#fff;border:0;width:100%;padding:0;overflow:hidden}
.boot:before{content:"";position:absolute;width:260vmax;height:260vmax;left:50%;top:50%;margin:-130vmax 0 0 -130vmax;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.045) 0 9deg,transparent 9deg 18deg);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.boot .logo{display:flex;gap:8px;align-items:center;position:relative}
.boot .logo i{display:block;width:38px;height:86px;border-radius:19px;border:3px solid #06051a}
.boot .logo i.a{background:var(--jl);animation:slideL .7s cubic-bezier(.2,.9,.3,1.3) both}
.boot .logo i.b{background:var(--jr);animation:slideR .7s cubic-bezier(.2,.9,.3,1.3) both}
.boot .logo em{font:700 4rem var(--display);font-style:normal;padding:0 12px;color:#fff;text-shadow:0 5px 0 #06051a,3px 0 0 #06051a,-3px 0 0 #06051a,0 -3px 0 #06051a;animation:fade .6s .5s both}
.boot p{position:relative;margin:0;font:700 1.1rem var(--display);background:#fff;color:#141230;border-radius:999px;padding:8px 20px;box-shadow:0 4px 0 #06051a;animation:blink 1.6s 1.1s infinite both}
@keyframes slideL{from{transform:translateX(-60vw)}}
@keyframes slideR{from{transform:translateX(60vw)}}
@keyframes fade{from{opacity:0;transform:scale(.6) rotate(-6deg)}}
@keyframes blink{0%,100%{opacity:.55}50%{opacity:1}}

/* ---------- Fenêtres et notifications ---------- */
.modal{position:fixed;inset:0;z-index:40;background:rgba(14,12,36,.62);display:flex;align-items:center;justify-content:center;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.box{background:var(--bg);border:3px solid var(--edge);border-radius:26px;width:100%;max-width:500px;max-height:100%;overflow-y:auto;padding:24px;position:relative;box-shadow:0 8px 0 var(--edge);animation:boxin .25s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes boxin{from{transform:scale(.9) translateY(10px);opacity:0}}
.box h2{margin-top:0}
.close{position:absolute;top:12px;right:12px;z-index:2}
.bigcard{border-radius:24px;padding:28px 22px;color:#fff;text-align:center;border:3px solid var(--edge);box-shadow:0 6px 0 var(--edge);
  background:radial-gradient(rgba(255,255,255,.12) 1.6px,transparent 2.2px) 0 0/16px 16px,#2a2160;box-shadow:inset 0 12px 0 var(--jl),inset 0 -12px 0 var(--jr),0 6px 0 var(--edge)}
.bigcard small{display:block;margin-top:10px}
.bigcard .e{font-size:76px;line-height:1}
.bigcard h3{font:700 1.8rem/1.2 var(--display);margin:14px 0 8px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.bigcard p{font-size:1.1rem;margin:0 0 6px}
.bigcard small{opacity:.92}
.toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--surface);color:var(--ink);border:2.5px solid var(--edge);border-radius:999px;padding:9px 18px;font:700 .98rem var(--display);box-shadow:var(--sh);animation:tin .35s cubic-bezier(.2,.9,.3,1.3) both}
.toast.gold{background:var(--sun);color:#1d1a3a}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.9)}}
.lvl{text-align:center}
.lvl .num{font:700 5.6rem/1 var(--display);color:var(--sun);-webkit-text-stroke:3px var(--edge);text-shadow:0 6px 0 var(--edge)}
.burst{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:24px}
.burst i{position:absolute;top:40%;left:50%;font-style:normal;font-size:22px;animation:fly 1.2s ease-out both}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(200deg);opacity:0}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:270px;margin:18px auto 0}
.keypad button{height:60px;border-radius:50%;border:2.5px solid var(--edge);background:var(--surface);font:700 1.35rem var(--display);box-shadow:var(--sh)}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.dots{display:flex;justify-content:center;gap:14px;margin-top:8px}
.dots i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--edge);background:var(--surface)}
.dots i.f{background:var(--jr)}
.chart{width:100%;height:auto;display:block;background:var(--surface);border:2.5px solid var(--edge);border-radius:14px}
.rates{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.rate{border:2.5px solid var(--edge);background:var(--surface);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--sh-s)}
.rate.sel{background:var(--sun);color:#1d1a3a}
.rate span{font-size:.86rem;text-align:center}
.rate .rate-i{font-size:34px;line-height:0}
.rate .rate-i .ico{width:1em;height:1em;stroke-width:2.2}
.rate.sel .rate-i .ico{color:#1d1a3a}

/* ---------- Cadres d'avatar ---------- */
.av.fr-etoiles{box-shadow:0 0 0 3px var(--bg),0 0 0 6px #f5b400;border-style:dotted;border-color:#b98500}
.av.fr-feu{box-shadow:0 0 0 3px #ff6a00,0 0 16px 3px #ff6a00}
.av.fr-arc{border-color:transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(#ff4554,#ffb800,#2fd36f,#00c3e3,#8b5cf6,#ff4554) border-box;box-shadow:0 0 0 2px var(--edge)}
.av.fr-or{border:4px double #d4a017;box-shadow:0 0 0 2px var(--edge),0 0 14px rgba(212,160,23,.8)}
.framepick{border:2.5px solid var(--edge);background:var(--surface);border-radius:var(--r);padding:12px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;box-shadow:var(--sh-s)}
.framepick.sel{background:var(--sun);color:#1d1a3a}
.framepick.lock{opacity:.5;box-shadow:none}
.framepick small{font:600 .76rem var(--display)}
/* ---------- Fonds d'écran ---------- */
.wp-nuages{background-image:radial-gradient(ellipse 180px 60px at 15% 22%,rgba(255,255,255,.55),transparent 70%),radial-gradient(ellipse 240px 70px at 80% 55%,rgba(255,255,255,.45),transparent 70%),radial-gradient(ellipse 160px 50px at 35% 88%,rgba(255,255,255,.4),transparent 70%),linear-gradient(180deg,rgba(0,170,220,.18),rgba(0,170,220,0))}
.wp-pixels{background-image:linear-gradient(45deg,rgba(127,127,170,.12) 25%,transparent 25%,transparent 75%,rgba(127,127,170,.12) 75%),linear-gradient(45deg,rgba(127,127,170,.12) 25%,transparent 25%,transparent 75%,rgba(127,127,170,.12) 75%);background-size:24px 24px;background-position:0 0,12px 12px}
.wp-ciel{background-image:radial-gradient(2px 2px at 20% 30%,var(--jr),transparent),radial-gradient(2.5px 2.5px at 70% 20%,var(--jl),transparent),radial-gradient(1.5px 1.5px at 40% 70%,var(--muted),transparent),radial-gradient(2px 2px at 85% 80%,var(--jr),transparent),radial-gradient(1.5px 1.5px at 10% 85%,var(--jl),transparent),radial-gradient(1.5px 1.5px at 55% 45%,var(--muted),transparent);background-size:200px 200px}
.wp-vagues{background-image:repeating-radial-gradient(circle at 0 100%,transparent 0 22px,rgba(0,150,220,.12) 22px 27px)}
.wpprev{border:2.5px solid var(--edge);border-radius:var(--r);padding:0;overflow:hidden;background-color:var(--bg);text-align:left;position:relative;box-shadow:var(--sh-s)}
.wpprev .sw2{display:block;height:72px;border-bottom:2.5px solid var(--edge)}
.wpprev b{display:block;font:700 .88rem var(--display);padding:6px 10px 0;background:var(--surface)}
.wpprev small{display:block;font-size:.72rem;color:var(--muted);padding:0 10px 8px;background:var(--surface)}
.wpprev.sel{outline:3px solid var(--jr);outline-offset:3px}
.wpprev.lock{opacity:.5;box-shadow:none}
/* ---------- Route, coffre, saison ---------- */
.route{display:flex;flex-direction:column;gap:8px;position:relative}
.step{display:flex;align-items:center;gap:12px;background:var(--surface);border:2.5px solid var(--edge);border-radius:var(--r);padding:10px 12px}
.step .n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 1.05rem var(--display);background:var(--surface2);border:2.5px solid var(--edge);flex:0 0 auto}
.step.done .n{background:var(--ok);color:#fff}
.step.next{background:var(--sun);color:#1d1a3a;box-shadow:var(--sh)}
.step.next small{color:#4a4520}
.step .tx{flex:1;min-width:0}
.step b{font-family:var(--display)}
.step small{display:block;color:var(--muted);font-size:.8rem}
.chest{display:inline-flex;align-items:center;gap:10px;margin-top:14px;background:var(--sun);color:#1d1a3a;border:3px solid var(--edge);border-radius:18px;padding:10px 18px;font:700 1.25rem var(--display);box-shadow:var(--sh)}
.chest span{font-size:36px;animation:pop .6s .2s both}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:none}}
.medal{font-size:68px;line-height:1;margin:6px 0}

/* ---------- Compagnon ---------- */
.stage{position:relative;border-radius:22px;background:linear-gradient(180deg,#c9f1ff,#eafaff 62%,#a6e3a1 63%,#7fcf7a);border:3px solid var(--edge);height:220px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;font-size:116px;padding-bottom:20px;box-shadow:var(--sh)}
.pet{position:relative;background:none;border:0;padding:0;font-size:1em;line-height:1;cursor:pointer;filter:var(--sticker);animation:idle 3s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-4px) scale(1.02,.98)}}
.pet .body{display:block}
.pet .hat{position:absolute;top:-.42em;left:50%;transform:translateX(-50%);font-size:.5em}
.pet .obj{position:absolute;right:-.4em;bottom:0;font-size:.42em}
.pet.hop{animation:hop .45s ease}
@keyframes hop{40%{transform:translateY(-18px) scale(1.06)}}
.bubble{position:relative;margin:16px auto 4px;max-width:440px;background:var(--surface);border:3px solid var(--edge);border-radius:18px;padding:11px 15px;text-align:center;font-weight:500;box-shadow:var(--sh-s)}
.bubble:before{content:"";position:absolute;top:-13px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom:13px solid var(--edge)}
.bubble:after{content:"";position:absolute;top:-8px;left:50%;margin-left:-7px;border:7px solid transparent;border-top:0;border-bottom:9px solid var(--surface)}
.homepet{display:flex;align-items:center;gap:14px}
.homepet .stage{height:82px;width:82px;flex:0 0 auto;padding:0;border-radius:50%;box-shadow:var(--sh-s);align-items:center;font-size:44px!important}
.homepet .pet{margin-top:.3em;animation:none}
.homepet .pet .obj{display:none}
.homepet .stage .deco{display:none}
.homepet .bubble{margin:0;flex:1;text-align:left;max-width:none}
.homepet .bubble:before{top:50%;left:-14px;margin:-10px 0 0;border:10px solid transparent;border-left:0;border-right:13px solid var(--edge)}
.homepet .bubble:after{top:50%;left:-8px;margin:-7px 0 0;border:7px solid transparent;border-left:0;border-right:9px solid var(--surface)}

/* ---------- Focus ---------- */
.disc{width:220px;height:220px;border-radius:50%;margin:10px auto 6px;display:grid;place-items:center;border:3px solid var(--edge);background:var(--surface2);box-shadow:var(--sh)}
.disc span{width:156px;height:156px;border-radius:50%;background:var(--surface);border:3px solid var(--edge);display:grid;place-items:center;font:700 2.4rem var(--display)}
.tmrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.stepchk{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:2.5px solid var(--edge);border-radius:14px;padding:11px 12px;text-align:left}
.stepchk .bx{width:30px;height:30px;border-radius:9px;border:2.5px solid var(--edge);display:grid;place-items:center;flex:0 0 auto;font:700 16px var(--display);background:var(--surface2)}
.stepchk.ok{opacity:.75}
.stepchk.ok .bx{background:var(--ok);color:#fff}
.stepchk.ok span:last-child{text-decoration:line-through}
.prog{height:12px;border-radius:7px;background:var(--surface2);border:2px solid var(--edge);overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--ok)}
.diff{font:700 .72rem var(--display);border-radius:999px;padding:2px 9px;border:2px solid var(--edge);background:var(--surface2);color:var(--ink);margin-left:6px;cursor:pointer}
.diff.d{background:var(--jl);color:#fff}
.diff.f{background:var(--ok);color:#fff}
.deal{background:linear-gradient(90deg,rgba(255,210,63,.35),var(--surface) 70%);box-shadow:var(--sh)}
.strike{text-decoration:line-through;opacity:.6}
.leadbtn{display:none}
body.pictos .lead{display:none}
body.pictos .leadbtn{display:inline-flex;margin:12px 0 4px}
body.pictos .need .e{font-size:52px}
body.pictos .mission .ic{font-size:40px}
body.pictos .skill .e{font-size:36px}
body.pictos .chip{font-size:1rem;padding:10px 16px}
body.calm .tile .bdg,body.calm .homepet,body.calm .burst,body.calm .season,body.calm .tile:before{display:none}
body.calm .tile{filter:saturate(.55)}
body.calm .grip{filter:saturate(.45)}
body.calm .xpbar i{animation:none}
.flag{color:var(--jl);font-weight:600}

/* ---------- Ajouts : aides prévues, carte levée, fiertés, radar ---------- */
.need.planned{outline:3px solid var(--ok);outline-offset:3px}
.ptag{position:absolute;top:-11px;right:10px;font:700 .7rem var(--display);color:#fff;background:var(--ok);border:2px solid var(--edge);border-radius:999px;padding:1px 8px;transform:rotate(3deg)}
.ptag2{display:inline-block;font:700 .7rem var(--display);background:var(--warn);color:#2a1d00;border:2px solid var(--edge);border-radius:999px;padding:0 8px;margin-right:4px}
.planline{font:700 .95rem var(--display)!important;background:var(--ok);border:2px solid var(--edge);border-radius:999px;display:inline-block;padding:3px 14px;margin-top:6px!important}
.bigcard .hint2{display:none}
.modal.raised{padding:0;background:var(--bezel)}
.modal.raised .box{max-width:none;height:100%;max-height:none;border-radius:0;padding:0;display:flex;background:transparent}
.modal.raised .box > :not(.bigcard){display:none}
.modal.raised .bigcard{flex:1;border-radius:0;border:0;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.modal.raised .bigcard .e{font-size:min(30vw,180px)}
.modal.raised .bigcard h3{font-size:clamp(2rem,7vw,4.2rem)}
.modal.raised .bigcard p{font-size:clamp(1.2rem,3.6vw,2rem);max-width:30ch}
.modal.raised .bigcard .hint1{display:none}
.modal.raised .bigcard .hint2{display:block;margin-top:18px;opacity:.75}
.bigcard.pride{background:radial-gradient(rgba(255,255,255,.2) 1.6px,transparent 2.2px) 0 0/16px 16px,linear-gradient(150deg,#f2a900,#ff7a00)}
.pridecard{background:linear-gradient(90deg,rgba(255,210,63,.35),var(--surface) 70%)}
.radarcard{text-align:center}
.radar{width:100%;max-width:360px;height:auto;display:block;margin:0 auto}
.legend{display:flex;justify-content:center;gap:18px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:0;vertical-align:middle;margin-right:6px}
.legend .lg1{border-top:2px dashed var(--muted)}
.legend .lg2{border-top:4px solid var(--jr)}
.radar polygon:last-of-type{stroke-linejoin:round}
.jr{font-size:1.2rem;white-space:nowrap}
.warnbox{background:linear-gradient(90deg,rgba(255,176,32,.25),var(--surface) 70%)}
#print{display:none}

@media (max-width:640px){
  .tile .art{top:12px;right:12px;transform:none}
  .tile .art .ico{width:42px;height:42px}
  .tile:hover .art,.tile.on .art{transform:scale(1.06)}
  .tile:first-child .art{top:50%;transform:translateY(-58%)}
  .tile:first-child .art .ico{width:76px;height:76px}
  .tile:first-child:hover .art,.tile:first-child.on .art{transform:translateY(-62%) scale(1.06)}
  .tile .nm{font-size:1rem;left:12px;bottom:10px}
  .subhead{padding:12px 12px;gap:8px}
  .subhead h1{font-size:1.25rem}
  .subhead .h1e{display:none}
  .backbtn{padding:6px 12px 6px 9px}
  .mission{flex-wrap:wrap}
  .mission .tx{flex:1 1 calc(100% - 60px)}
  .mission .tx + *{margin-left:auto}
  .homepet .stage{width:66px;height:66px;font-size:36px!important}
  .homepet .pet{margin-top:.3em}
}

/* ---------- Impression de la fiche bilan ---------- */
@media print{
  @page{size:A4;margin:14mm}
  html,body{height:auto;overflow:visible;background:#fff!important;color:#111}
  :root{padding:0}
  .shell,#modal,.toasts,.boot{display:none!important}
  #print{display:block;font:10.5pt/1.45 var(--body);color:#111}
  #print h1{font:600 20pt var(--display);margin:0}
  #print h2{font:600 12pt var(--display);margin:12px 0 4px;border-bottom:1.5px solid #ccc;padding-bottom:2px;break-after:avoid}
  #print p,#print ul{margin:4px 0}
  #print ul{padding-left:18px}
  .pr-head{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #222;padding-bottom:6px}
  .pr-head p{margin:2px 0 0;font-size:12pt}
  .pr-av{font-size:38pt}
  .pr-note{font-size:9pt;color:#555}
  .pr-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
  .pr-stats div{border:1px solid #bbb;border-radius:6px;padding:5px;text-align:center;font-size:8.5pt}
  .pr-stats b{display:block;font:600 15pt var(--display)}
  .pr-cols{display:flex;gap:12px;align-items:flex-start;break-inside:avoid}
  .pr-cols > div:first-child{flex:1.5}
  .pr-radar{flex:1}
  .pr-radar .radar{max-width:250px}
  #print table{width:100%;border-collapse:collapse;font-size:9pt}
  #print th,#print td{border:1px solid #bbb;padding:3px 5px;text-align:left;vertical-align:top}
  #print td.c{text-align:center;font-size:12pt}
  #print small{color:#666}
  .pr-lines{border-bottom:1px solid #999;height:22px}
}

body.nomotion *,body.nomotion *:before,body.nomotion *:after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

    return c;
  }
  d = new Date();
  if(p.days.indexOf(dstr(d)) >= 0) c++;

/* note douce : sinus + harmonique, attaque courte, extinction exponentielle */

  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + dur + 0.03);

      case "click":  /* ouvrir : pop rond qui monte */

      case "sel":    /* choisir, cocher : bulle courte */
        clk(t, 3600, 0.45, 0.018); tone(t, 900, 0.07, 0.34, "sine", 1350); break;

function gain(p, xp, gems, label){

  p.xp += xp; p.gems += gems;
  markDay(p);
  var parts = [];
  if(xp) parts.push("+"+xp+" XP");
  if(gems) parts.push("+"+gems+" "+GEM());
  if(parts.length) toast((label ? esc(label)+" &nbsp;" : "")+parts.join(" &nbsp;"), true, boosted ? "bolt" : null, true);
  var info = applyLevels(p, before);
  save();
  if(info){ setTimeout(function(){ levelUp(info); }, 450); }
  checkTrophies(p);
}
function applyLevels(p, before){
  var after = level(p.xp);
  if(after <= before) return null;
  var chest = 0, unl = [], ob = p.best, items = [];
  SHOP.forEach(function(it){ if(it.lv > ob && it.lv <= after) items.push(it); });
  for(var L = before+1; L <= after; L++){
    chest += chestAt(L);
    if(L > p.best) unl = unl.concat(unlocksAt(L));
  }
  p.gems += chest;
  if(after > p.best) p.best = after;
  return {from:before, to:after, chest:chest, unl:unl, items:items};
}

/* Découpage syllabique du français (approché, sans dictionnaire) */
var DV = "aeiouyàâäéèêëîïôöùûüÿœæ", DINSEP = ["bl","br","ch","cl","cr","dr","fl","fr","gl","gn","gr","ph","pl","pr","th","tr","vr","qu","gu"];
function isV(w, i){
  var c = w.charAt(i);
  if(DV.indexOf(c) < 0) return false;
  if(c === "u" && i > 0 && w.charAt(i-1) === "q") return false;
  if(c === "u" && i > 0 && w.charAt(i-1) === "g" && i+1 < w.length && "eiéèêy".indexOf(w.charAt(i+1)) >= 0) return false;
  if(c === "y" && i > 0 && i+1 < w.length && DV.indexOf(w.charAt(i+1)) >= 0) return false;
  return true;
}
function syllabes(word){
  var w = word.toLowerCase(), n = w.length, i, v = [], cuts = [], k = 0;
  if(n < 3) return [word];
  for(i=0;i<n;i++) v.push(isV(w, i));
  while(k < n && !v[k]) k++;
  while(k < n){
    while(k < n && v[k]) k++;
    var c0 = k; while(k < n && !v[k]) k++;
    if(k >= n) break;
    var nc = k - c0, cut;
    if(nc <= 1) cut = c0;
    else if(nc === 2) cut = DINSEP.indexOf(w.substr(c0, 2)) >= 0 ? c0 : c0 + 1;
    else cut = DINSEP.indexOf(w.substr(k-2, 2)) >= 0 ? k - 2 : k - 1;
    if(cut > 0 && cut < n) cuts.push(cut);
  }
  var out = [], prev = 0;
  cuts.forEach(function(c){ out.push(word.substring(prev, c)); prev = c; });
  out.push(word.substring(prev));
  return out;
}
var DYS_SKIP = "script,style,textarea,input,svg,.ptag,.ptag2,.diff,.fontpick,.pill,.clock,.num,#ttime,.lvb,.bdg,.keypad,.dots,.hints,.av,.pick,.disc";
function dysDecorate(root){
  var d = dysOf(); if(!root || !d || !(d.syl || d.bio)) return;
  var walker = document.createTreeWalker(root, 4, null, false), nodes = [], t;
  while((t = walker.nextNode())){ if(/[A-Za-zÀ-ÿ]/.test(t.nodeValue) && !closest(t.parentNode, DYS_SKIP)) nodes.push(t); }
  var re = /([A-Za-zÀ-ÖØ-öø-ÿŒœÆæ]+)/g;
  nodes.forEach(function(node){
    var txt = node.nodeValue, frag = document.createDocumentFragment(), last = 0, m;
    re.lastIndex = 0;
    while((m = re.exec(txt))){
      if(m.index > last) frag.appendChild(document.createTextNode(txt.substring(last, m.index)));
      var word = m[1], sp = document.createElement("span");
      if(d.syl){
        syllabes(word).forEach(function(sy, j){ var x = document.createElement("span"); x.className = "sy"+(j%2); x.textContent = sy; sp.appendChild(x); });
      } else {
        var nb = word.length < 2 ? word.length : Math.ceil(word.length*0.45);
        var bb = document.createElement("b"); bb.className = "bio"; bb.textContent = word.substring(0, nb); sp.appendChild(bb);
        sp.appendChild(document.createTextNode(word.substring(nb)));
      }
      frag.appendChild(sp); last = m.index + word.length;
    }
    if(last < txt.length) frag.appendChild(document.createTextNode(txt.substring(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

function radar(p, print){

    var a = r.length ? r[0].v : 0, b = r.length ? r[r.length-1].v : 0, qa = pt(i, a), qb = pt(i, b);

  h += '<polygon points="'+last.join(" ")+'" fill="'+c2+'" fill-opacity=".25" stroke="'+c2+'" stroke-width="3" stroke-linejoin="round"/>';
  return '<svg class="radar" viewBox="0 0 '+W+' 300" role="img" aria-label="Carte de mes compétences : au début et maintenant">'+h+'</svg>';

function chart(arr){
  var pts = arr.slice(-12), W = 320, H = 130, px = 26, py = 16;
  if(pts.length < 2) return '<p class="note">Ta courbe apparaîtra dès ta deuxième évaluation.</p>';

    if(i===0 || i===pts.length-1) lbl += '<text x="'+x.toFixed(1)+'" y="'+(H-2)+'" font-size="10" text-anchor="middle" fill="var(--muted)">'+fdate(r.d)+'</text>';
  });

  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Évolution de la compétence">'+grid+
    '<polyline points="'+poly.join(" ")+'" fill="none" stroke="var(--jr)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+dots+lbl+'</svg>';

/* =================== Actions =================== */
function act(a, v, el){
  var p = cur();
  switch(a){
    case "boot":
      beep("boot");
      var b = document.querySelector(".boot"); if(b) b.parentNode.removeChild(b);
      screen = p ? "home" : "who"; render(); break;
    case "bg": break;
    case "close": closeModal(); beep("back"); break;
    case "say": speak(v); break;
    case "towho": newP = null; go("who"); beep("back"); break;
    case "pick": S.cur = v; checkSeason(cur()); save(); homeIdx = 0; beep("ok"); go("home"); break;
    case "newp": newP = {name:"", av:"renard", th:"neon"}; beep("click"); go("new"); break;
    case "npav": newP.name = $("pname").value; newP.av = v; beep("sel"); render(); break;
    case "create":
      var nm = ($("pname").value || "").replace(/^\s+|\s+$/g, "");
      if(!nm){ beep("err"); toast("Écris ton prénom ou un pseudo"); $("pname").focus(); return; }
      var np = blankProfile(nm, newP.av, "neon");
      [0,1,2].forEach(function(i){ np.missions.push({id:"m"+Date.now()+i, e:SUGG[i].e, t:SUGG[i].t, last:"", count:0}); });
      S.profiles.push(np); S.cur = np.id; newP = null; markDay(np); checkSeason(np); save();
      beep("lvl"); homeIdx = 0; go("home");
      setTimeout(function(){ toast("Bienvenue "+nm+" ! Tes 3 premières missions t’attendent", true); }, 300);
      break;
    case "home": beep("back"); tUnlocked = false; pinBuf = ""; go("home"); break;
    case "go":
      if(v === "joueurs"){ beep("back"); S.cur = null; save(); go("who"); return; }
      if(v === "dys"){ p.dys.on = !p.dys.on; save(); beep("sel"); toast(p.dys.on ? "Mode DYS activé (à régler dans Réglages)" : "Mode DYS désactivé", false, "dys"); render(); return; }
      if(v === "calme"){ S.settings.calm = !S.settings.calm; save(); beep("sel"); toast(S.settings.calm ? "Mode calme activé" : "Mode calme désactivé", false, "calme"); render(); return; }
      for(var ti=0; ti<TILES.length; ti++){ if(TILES[ti].id===v) homeIdx = ti; }
      beep("click"); go(v); break;
    case "gomodal": closeModal(); go(v); break;
    case "inbox":
      var msgs = p.inbox.map(function(m){ return '<div class="save"><span class="dt">'+fdate(m.d)+'</span><span style="flex:1">'+esc(m.t)+'</span></div>'; }).join("");
      p.inbox = []; save(); beep("ok");
      modal('<h2>'+ic("mail", "h2i")+'Message de ton prof</h2><div class="list">'+msgs+'</div><p><button class="btn" data-a="close">Merci !</button></p>');
      render(); break;

    case "mdone":
      var md2 = null;
      p.missions.forEach(function(m){ if(m.id===v && m.last!==today()){ m.last = today(); m.count++; p.st.m++; md2 = m; } });
      if(!md2) return;
      var df = DIFF[md2.lvl||"n"];
      beep("ok"); gain(p, df.xp, df.g, md2.lvl === "d" ? "Défi relevé, bravo !" : "Ton effort paie !"); render(); break;
    case "mdiff":
      p.missions.forEach(function(m){ if(m.id===v){ var o = ["f","n","d"], k = o.indexOf(m.lvl||"n"); m.lvl = o[(k+1)%3]; } });
      save(); beep("sel"); render(); break;
    case "gform": gForm = !gForm; render(); break;
    case "gwhen": gWhen = +v; var gt0 = $("gtitle"); var keep = gt0 ? gt0.value : ""; var ks = []; for(var gi0=0; gi0<4; gi0++){ var e0 = $("gs"+gi0); ks.push(e0 ? e0.value : ""); }
      render(); if($("gtitle")) $("gtitle").value = keep; for(var gi1=0; gi1<4; gi1++){ if($("gs"+gi1)) $("gs"+gi1).value = ks[gi1]; } break;
    case "gadd":
      var gt = ($("gtitle").value || "").replace(/^\s+|\s+$/g, ""), gsteps = [];
      for(var gi=0; gi<4; gi++){ var sv = ($("gs"+gi).value || "").replace(/^\s+|\s+$/g, ""); if(sv) gsteps.push({t:sv, done:false}); }
      if(!gt || !gsteps.length){ beep("err"); toast("Écris ton objectif et au moins une étape"); return; }
      p.goals.push({id:"g"+Date.now(), t:gt, when:GOAL_WHEN[gWhen], steps:gsteps, done:false, d:today()});
      gForm = false; save(); beep("ok"); toast("Objectif lancé ! Une étape à la fois.", true); render(); break;

document.addEventListener("keydown", function(e){

  if(e.key === "Tab" && $("modal").innerHTML){
    var fs = $("modal").querySelectorAll(".box button:not([disabled]), .box input, .box textarea");
    if(fs.length){
      var first = fs[0], last = fs[fs.length-1], inBox = closest(document.activeElement, ".box");
      if(!inBox){ first.focus(); e.preventDefault(); }
      else if(e.shiftKey && document.activeElement === first){ last.focus(); e.preventDefault(); }

    }

  }
  if(document.querySelector(".boot") && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); act("boot"); return; }
  if(e.key === "Escape" || (!typing && (e.key === "b" || e.key === "B" || e.key === "Backspace"))){
    if(document.querySelector(".modal.raised")){ act("lower"); e.preventDefault(); return; }
    if($("modal").innerHTML){ closeModal(); e.preventDefault(); return; }
    if(screen === "prof" && !tUnlocked && e.key === "Backspace"){ act("pinc"); e.preventDefault(); return; }
    if(screen !== "home" && screen !== "who" && screen !== "boot" && cur()){ e.preventDefault(); act("home"); }
    return;
  }
  if(typing) return;
  if(screen === "prof" && !tUnlocked && /^[0-9]$/.test(e.key)){ act("pin", e.key); return; }
  if((e.key === "a" || e.key === "A") && document.activeElement && document.activeElement !== document.body){ document.activeElement.click(); return; }
  if(screen !== "home" || $("modal").innerHTML) return;
  var inTiles = closest(document.activeElement, "#tiles"), inR = closest(document.activeElement, "#rbtns");

    var dir = e.key === "ArrowRight" ? 1 : -1;
    if(inR){
      var rb = document.querySelectorAll(".rbtn"), ri = +document.activeElement.getAttribute("data-r");
      rb[(ri + dir + rb.length) % rb.length].focus(); beep("move");
    } else setTile(homeIdx + dir, true);
    e.preventDefault();
  } else if(e.key === "ArrowDown" && inTiles){
    document.querySelector(".rbtn").focus(); e.preventDefault();
  } else if(e.key === "ArrowUp" && inR){
    setTile(homeIdx, true); e.preventDefault();
  } else if(e.key === "ArrowDown" && !inR){
    setTile(homeIdx, true); e.preventDefault();
  }
});
setInterval(function(){ var c = $("clock"); if(c) c.textContent = clockTxt(); }, 20000);

/* =================== Démarrage =================== */
S = load();
if(S.cur && !cur()) S.cur = null;
checkSeason(cur());
applySettings();
render();
})();
</script>
</body>
</html>
