<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boost — ma console de progrès</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9e9eb; --surface:#ffffff; --surface2:#f4f4f6; --ink:#262629; --muted:#66666e; --line:#d4d4da;
  --bezel:#1f1f23; --jl:#ff4554; --jr:#00c3e3; --ok:#18b26b; --warn:#f2a900;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Lexend","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2b2b2f; --surface:#3a3a40; --surface2:#33333a; --ink:#f3f3f5; --muted:#b4b4bd; --line:#4b4b53; --bezel:#111114;
  }
}
:root[data-theme="dark"]{
  --bg:#2b2b2f; --surface:#3a3a40; --surface2:#33333a; --ink:#f3f3f5; --muted:#b4b4bd; --line:#4b4b53; --bezel:#111114;
}
*,*:before,*:after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bezel);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-tap-highlight-color:transparent;overflow:hidden}
body.spacing{letter-spacing:.03em;word-spacing:.14em;line-height:1.8}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--jr);outline-offset:3px}
img{max-width:100%}

/* ---------- Console shell ---------- */
.shell{height:100%;display:flex;align-items:stretch;justify-content:center}
.grip{display:none}
.screen{flex:1;min-width:0;height:100%;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden;
  border-left:5px solid var(--jl);border-right:5px solid var(--jr)}
@media (min-width:900px){
  .shell{padding:22px 0}
  .grip{display:flex;flex-direction:column;align-items:center;justify-content:space-around;width:96px;flex:0 0 96px;padding:30px 0}
  .grip.l{background:var(--jl);border-radius:48px 0 0 48px}
  .grip.r{background:var(--jr);border-radius:0 48px 48px 0}
  .screen{max-width:1100px;border:16px solid var(--bezel);border-radius:6px;flex:0 1 1100px}
  .stick{width:52px;height:52px;border-radius:50%;background:#2a2a2e;box-shadow:inset 0 -5px 0 rgba(0,0,0,.35),0 3px 0 rgba(0,0,0,.25)}
  .pad{width:76px;height:76px;position:relative}
  .pad span{position:absolute;width:24px;height:24px;border-radius:50%;background:#2a2a2e;box-shadow:inset 0 -3px 0 rgba(0,0,0,.4);color:#cfcfd6;font:600 11px/24px var(--display);text-align:center}
  .pad span:nth-child(1){left:26px;top:0}.pad span:nth-child(2){left:52px;top:26px}.pad span:nth-child(3){left:26px;top:52px}.pad span:nth-child(4){left:0;top:26px}
  .mini{width:20px;height:6px;border-radius:3px;background:#2a2a2e}
  .home-btn{width:22px;height:22px;border-radius:50%;background:#2a2a2e;border:3px solid rgba(255,255,255,.35)}
  .sq{width:20px;height:20px;border-radius:5px;background:#2a2a2e}
}
@media (max-width:899px){ .screen{border-width:0 4px} }

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:14px 20px 8px;flex:0 0 auto}
.me{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--surface);border:3px solid var(--jr);flex:0 0 auto}
.me b{font:600 1.05rem var(--display);display:block;line-height:1.1}
.me small{color:var(--muted);font-size:.78rem}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:6px 12px;font:600 .95rem var(--display);border:1px solid var(--line)}
.clock{font:500 1.05rem var(--display);color:var(--muted);min-width:48px;text-align:right}
.xpwrap{padding:0 20px 6px}
.xpbar{height:10px;border-radius:5px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--jl),var(--jr));border-radius:5px;transition:width .6s}
.xptxt{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:3px}

.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:6px 20px 28px}

/* ---------- Home ---------- */
.inbox{display:flex;align-items:center;gap:10px;width:100%;margin:6px 0 4px;padding:10px 14px;border-radius:14px;border:2px dashed var(--jl);background:var(--surface);text-align:left;font-weight:500}
.tile-title{font:600 1.5rem var(--display);margin:18px 2px 10px;min-height:2.2rem;color:var(--jr)}
.tiles{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 6px 18px;margin:0 -6px}
.tile{flex:0 0 auto;width:min(42vw,210px);aspect-ratio:1/1;border-radius:8px;border:0;padding:0;position:relative;scroll-snap-align:start;
  background:var(--t1);box-shadow:0 2px 0 rgba(0,0,0,.12);overflow:hidden;color:#fff;text-align:left}
.tile .art{position:absolute;inset:0;display:grid;place-items:center;font-size:min(16vw,84px);
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 55%),linear-gradient(150deg,var(--t1),var(--t2))}
.tile .nm{position:absolute;left:10px;bottom:9px;right:10px;font:600 .95rem/1.15 var(--display);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.tile .bdg{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.45);border-radius:999px;padding:2px 9px;font:600 .78rem var(--display)}
.tile.on,.tile:focus-visible{outline:none;box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--jr)}
.tile.on{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--jl)}}
.rbtns{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:12px 0 6px}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;width:76px}
.rbtn .c{width:58px;height:58px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:26px;border:1px solid var(--line);box-shadow:0 2px 0 var(--line)}
.rbtn span:last-child{font-size:.74rem;color:var(--muted);text-align:center;line-height:1.2}
.rbtn.on .c,.rbtn:focus-visible .c{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--jr)}
.rbtn:focus-visible{outline:none}
.hints{display:none;justify-content:flex-end;gap:18px;padding:8px 20px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem;flex:0 0 auto}
.hints b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 .75rem var(--display);margin-right:6px}
@media (min-width:900px){.hints{display:flex}}
.today{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.today div{flex:1 1 140px;background:var(--surface);border-radius:12px;padding:10px 14px;border:1px solid var(--line)}
.today b{font:600 1.4rem var(--display);display:block}
.today span{font-size:.8rem;color:var(--muted)}

/* ---------- Sub screens ---------- */
.subhead{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex:0 0 auto;border-bottom:1px solid var(--line)}
.backbtn{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 10px;font:600 .9rem var(--display)}
.subhead h1{font:600 1.35rem var(--display);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead{color:var(--muted);margin:14px 0 16px;max-width:62ch}
h2{font:600 1.15rem var(--display);margin:22px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;align-items:center;gap:12px}
.list{display:flex;flex-direction:column;gap:10px}
.mission{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--jr);border-radius:12px;padding:12px}
.mission.done{border-left-color:var(--ok)}
.mission .ic{font-size:28px;flex:0 0 auto}
.mission .tx{flex:1;min-width:0}
.mission .tx b{display:block;font-weight:500}
.mission .tx small{color:var(--muted)}
.btn{border:0;border-radius:999px;padding:10px 18px;font:600 .95rem var(--display);background:var(--jr);color:#fff;white-space:nowrap}
.btn.l{background:var(--jl)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.55;cursor:default}
.icon-btn{background:var(--surface2);border:1px solid var(--line);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-size:17px;flex:0 0 auto;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.88rem;text-align:left}
.chip.sel{border:2px solid var(--jr);background:var(--surface2)}
.field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1rem}
textarea.field{min-height:90px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.need{border:0;border-radius:16px;padding:14px 12px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:var(--surface);border:1px solid var(--line);position:relative}
.need .e{font-size:34px}
.need b{font:600 1rem/1.2 var(--display)}
.skill{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left}
.skill .e{font-size:26px}
.skill .tx{flex:1}
.skill small{display:block;color:var(--muted);font-size:.8rem}
.bars{display:flex;gap:4px;align-items:flex-end}
.bars i{width:10px;border-radius:3px;background:var(--line)}
.bars i:nth-child(1){height:10px}.bars i:nth-child(2){height:16px}.bars i:nth-child(3){height:22px}.bars i:nth-child(4){height:28px}
.bars i.f{background:linear-gradient(var(--jr),var(--jl))}
.save{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.save .dt{font:600 .8rem var(--display);color:#fff;background:var(--jl);border-radius:8px;padding:6px 8px;text-align:center;min-width:54px;line-height:1.15}
.reward{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.reward .e{font-size:30px;width:52px;height:52px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:0 0 auto}
.reward .tx{flex:1;min-width:0}
.reward small{color:var(--muted)}
.lockgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px}
.pick{aspect-ratio:1/1;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:34px;display:grid;place-items:center;position:relative;padding:0}
.pick.sel{border:4px solid var(--jr)}
.pick.lock{opacity:.4;font-size:26px}
.pick .lv{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:600 .65rem var(--display);padding:1px 6px;border-radius:999px;white-space:nowrap}
.consoles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.cons{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:10px;text-align:left;position:relative}
.cons.sel{border:3px solid var(--ink)}
.cons.lock{opacity:.45}
.cons .mock{display:flex;height:44px;border-radius:10px;overflow:hidden;margin-bottom:8px}
.cons .mock i{flex:0 0 22%}
.cons .mock em{flex:1;background:var(--bezel)}
.cons b{font:600 .9rem var(--display);display:block}
.cons small{color:var(--muted);font-size:.75rem}
.trophy{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.trophy .e{font-size:30px;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);flex:0 0 auto}
.trophy.lock .e{filter:grayscale(1);opacity:.35}
.trophy.lock b{color:var(--muted)}
.trophy small{color:var(--muted);display:block}
.moods{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.moodb{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.moodb .e{font-size:44px}
.moodb.sel{border:3px solid var(--jr)}
.week{display:flex;gap:8px;flex-wrap:wrap}
.week div{width:52px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 0;font-size:.72rem;color:var(--muted)}
.week span{display:block;font-size:22px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 10px;font:600 .9rem var(--display)}
.seg button.sel{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18);color:var(--jr)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.sw{width:54px;height:32px;border-radius:16px;background:var(--line);border:0;position:relative;flex:0 0 auto;padding:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--ok)}
.sw.on:after{left:25px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat3 div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat3 b{font:600 1.5rem var(--display);display:block;color:var(--jr)}
.stat3 span{font-size:.75rem;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.note{font-size:.82rem;color:var(--muted);margin-top:8px}
.danger{color:#d93a3a}
.hidden{display:none!important}

/* ---------- Profiles ---------- */
.who{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow-y:auto}
.who h1{font:600 1.7rem var(--display);margin:0 0 26px}
.users{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;max-width:720px}
.user{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;padding:0}
.user .av{width:88px;height:88px;font-size:46px;border-width:4px}
.user span{font:600 .95rem var(--display);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user small{color:var(--muted);font-size:.75rem}
.user.add .av{border-style:dashed;border-color:var(--muted);font-size:36px;color:var(--muted)}
.user:focus-visible{outline:none}.user:focus-visible .av{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--jr)}

/* ---------- Boot ---------- */
.boot{position:fixed;inset:0;z-index:50;background:var(--bezel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;color:#fff;border:0;width:100%;padding:0}
.boot .logo{display:flex;gap:6px;align-items:center}
.boot .logo i{display:block;width:34px;height:76px;border-radius:17px}
.boot .logo i.a{background:var(--jl);animation:slideL .7s cubic-bezier(.2,.9,.3,1.3) both}
.boot .logo i.b{background:var(--jr);animation:slideR .7s cubic-bezier(.2,.9,.3,1.3) both}
.boot .logo em{font:700 3.2rem var(--display);font-style:normal;padding:0 10px;animation:fade .6s .5s both}
.boot p{margin:0;font:500 1.05rem var(--display);opacity:.75;animation:blink 1.6s 1.1s infinite both}
@keyframes slideL{from{transform:translateX(-60vw)}}
@keyframes slideR{from{transform:translateX(60vw)}}
@keyframes fade{from{opacity:0;transform:scale(.8)}}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:.9}}

/* ---------- Modal / toast ---------- */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,10,14,.6);display:flex;align-items:center;justify-content:center;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.box{background:var(--bg);border-radius:20px;width:100%;max-width:480px;max-height:100%;overflow-y:auto;padding:22px;position:relative}
.box h2{margin-top:0}
.close{position:absolute;top:12px;right:12px}
.bigcard{border-radius:24px;padding:28px 22px;color:#fff;text-align:center;background:linear-gradient(150deg,var(--jl),var(--jr));box-shadow:0 10px 30px rgba(0,0,0,.25)}
.bigcard .e{font-size:72px;line-height:1}
.bigcard h3{font:600 1.7rem/1.2 var(--display);margin:14px 0 8px}
.bigcard p{font-size:1.1rem;margin:0 0 6px}
.bigcard small{opacity:.9}
.toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font:600 .95rem var(--display);box-shadow:0 6px 18px rgba(0,0,0,.25);animation:tin .35s both}
.toast.gold{background:linear-gradient(90deg,var(--jl),var(--jr));color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}}
.lvl{text-align:center}
.lvl .num{font:700 5rem/1 var(--display);background:linear-gradient(150deg,var(--jl),var(--jr));-webkit-background-clip:text;background-clip:text;color:transparent}
.burst{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:20px}
.burst i{position:absolute;top:40%;left:50%;font-style:normal;font-size:22px;animation:fly 1.2s ease-out both}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(200deg);opacity:0}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:16px auto 0}
.keypad button{height:58px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:600 1.3rem var(--display)}
.dots{display:flex;justify-content:center;gap:14px;margin-top:8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.dots i.f{background:var(--ink)}
.chart{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.rates{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.rate{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.rate.sel{border:3px solid var(--jr)}
.rate span{font-size:.85rem;text-align:center}

/* ---------- Cadres d'avatar ---------- */
.av.fr-etoiles{border:3px dotted #f5b400;box-shadow:0 0 0 3px var(--bg),0 0 0 5px #f5b400}
.av.fr-feu{border-color:#ff6a00;box-shadow:0 0 14px #ff6a00}
.av.fr-arc{border-color:transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(#ff4554,#ffb800,#2fd36f,#00c3e3,#8b5cf6,#ff4554) border-box}
.av.fr-or{border:4px double #d4a017;box-shadow:0 0 12px rgba(212,160,23,.7)}
.framepick{border:2px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.framepick.sel{border:3px solid var(--jr)}
.framepick.lock{opacity:.45}
.framepick small{font-size:.75rem;color:var(--muted)}
/* ---------- Fonds d'écran ---------- */
.wp-nuages{background-image:radial-gradient(ellipse 180px 60px at 15% 22%,rgba(255,255,255,.5),transparent 70%),radial-gradient(ellipse 240px 70px at 80% 55%,rgba(255,255,255,.4),transparent 70%),radial-gradient(ellipse 160px 50px at 35% 88%,rgba(255,255,255,.35),transparent 70%),linear-gradient(180deg,rgba(0,170,220,.14),rgba(0,170,220,0))}
.wp-pixels{background-image:linear-gradient(45deg,rgba(127,127,140,.1) 25%,transparent 25%,transparent 75%,rgba(127,127,140,.1) 75%),linear-gradient(45deg,rgba(127,127,140,.1) 25%,transparent 25%,transparent 75%,rgba(127,127,140,.1) 75%);background-size:24px 24px;background-position:0 0,12px 12px}
.wp-ciel{background-image:radial-gradient(2px 2px at 20% 30%,var(--jr),transparent),radial-gradient(2.5px 2.5px at 70% 20%,var(--jl),transparent),radial-gradient(1.5px 1.5px at 40% 70%,var(--muted),transparent),radial-gradient(2px 2px at 85% 80%,var(--jr),transparent),radial-gradient(1.5px 1.5px at 10% 85%,var(--jl),transparent),radial-gradient(1.5px 1.5px at 55% 45%,var(--muted),transparent);background-size:200px 200px}
.wp-vagues{background-image:repeating-radial-gradient(circle at 0 100%,transparent 0 22px,rgba(0,150,220,.1) 22px 27px)}
.wpprev{border:2px solid var(--line);border-radius:14px;padding:0;overflow:hidden;background-color:var(--bg);text-align:left;position:relative}
.wpprev .sw2{display:block;height:70px}
.wpprev b{display:block;font:600 .85rem var(--display);padding:6px 10px 0;background:var(--surface)}
.wpprev small{display:block;font-size:.72rem;color:var(--muted);padding:0 10px 8px;background:var(--surface)}
.wpprev.sel{border:3px solid var(--jr)}
.wpprev.lock{opacity:.45}
/* ---------- Route, coffre, saison ---------- */
.route{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.step .n{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:600 1rem var(--display);background:var(--surface2);border:2px solid var(--line);flex:0 0 auto}
.step.done .n{background:var(--jr);border-color:var(--jr);color:#fff}
.step.next{border:2px solid var(--jl)}
.step .tx{flex:1;min-width:0}
.step small{display:block;color:var(--muted);font-size:.8rem}
.chest{display:inline-flex;align-items:center;gap:10px;margin-top:12px;background:var(--surface);border:2px solid var(--warn);border-radius:16px;padding:10px 18px;font:600 1.2rem var(--display)}
.chest span{font-size:34px;animation:pop .6s .2s both}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:none}}
.season{display:flex;align-items:center;gap:10px;margin:8px 0 0;padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.88rem}
.season b{font:600 .95rem var(--display)}
.medal{font-size:64px;line-height:1;margin:6px 0}

/* ---------- Compagnon ---------- */
.stage{position:relative;border-radius:20px;background:linear-gradient(180deg,var(--surface),var(--surface2));border:1px solid var(--line);height:210px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;font-size:110px;padding-bottom:18px}
.stage .deco{position:absolute;right:12px;top:10px;font-size:.45em;opacity:.9}
.pet{position:relative;background:none;border:0;padding:0;font-size:1em;line-height:1;cursor:pointer}
.pet .body{display:block}
.pet .hat{position:absolute;top:-.42em;left:50%;transform:translateX(-50%);font-size:.5em}
.pet .obj{position:absolute;right:-.4em;bottom:0;font-size:.42em}
.pet.hop{animation:hop .45s ease}
@keyframes hop{40%{transform:translateY(-18px) scale(1.06)}}
.bubble{position:relative;margin:14px auto 4px;max-width:420px;background:var(--surface);border:2px solid var(--jr);border-radius:16px;padding:10px 14px;text-align:center;font-weight:500}
.bubble:before{content:"";position:absolute;top:-9px;left:50%;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:var(--jr)}
.homepet{display:flex;align-items:center;gap:12px;margin-top:8px}
.homepet .stage{height:86px;width:86px;flex:0 0 auto;padding-bottom:10px;border-radius:16px}
.homepet .stage .deco{display:none}
.homepet .bubble{margin:0;flex:1;text-align:left;max-width:none}
.homepet .bubble:before{top:50%;left:-9px;margin:-8px 0 0;border:8px solid transparent;border-left:0;border-right-color:var(--jr)}

/* ---------- Focus ---------- */
.disc{width:210px;height:210px;border-radius:50%;margin:10px auto 6px;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line);background:var(--surface2)}
.disc span{width:150px;height:150px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:600 2.3rem var(--display)}
.tmrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.stepchk{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left}
.stepchk .bx{width:30px;height:30px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;flex:0 0 auto;font-size:18px}
.stepchk.ok{opacity:.7}
.stepchk.ok .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.stepchk.ok span:last-child{text-decoration:line-through}
.prog{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--ok)}
.diff{font:600 .72rem var(--display);border-radius:999px;padding:2px 8px;border:1px solid var(--line);background:var(--surface2);margin-left:6px;cursor:pointer}
.diff.d{background:var(--jl);color:#fff;border-color:var(--jl)}
.diff.f{background:var(--ok);color:#fff;border-color:var(--ok)}
.deal{border:2px solid var(--warn)}
.strike{text-decoration:line-through;opacity:.6}
.leadbtn{display:none}
body.pictos .lead{display:none}
body.pictos .leadbtn{display:inline-flex;margin:12px 0 4px}
body.pictos .need .e{font-size:50px}
body.pictos .mission .ic{font-size:38px}
body.pictos .skill .e{font-size:34px}
body.pictos .chip{font-size:1rem;padding:10px 16px}
body.calm .tile .bdg,body.calm .homepet,body.calm .burst,body.calm .season{display:none}
body.calm .tile .art{filter:saturate(.5)}
body.calm .grip{filter:saturate(.45)}
body.calm .tile.on{animation:none}
.flag{color:var(--jl);font-weight:600}

body.nomotion *,body.nomotion *:before,body.nomotion *:after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

function pad(n){ return n<10 ? "0"+n : ""+n; }

function fdate(s){ var p = s.split("-"); return parseInt(p[2],10)+" "+MONTHS[parseInt(p[1],10)-1]; }
function wday(s){ var p = s.split("-"); return DAYS[new Date(+p[0], +p[1]-1, +p[2]).getDay()]; }

function $(id){ return document.getElementById(id); }
function closest(el, sel){
  while(el && el.nodeType===1){
    if(el.matches ? el.matches(sel) : el.msMatchesSelector(sel)) return el;
    el = el.parentNode;
  }
  return null;
}
function lvlFloor(L){ return 25*(L-1) + 3*(L-1)*(L-2); }
function level(xp){ var L = 1; while(L < MAXL && xp >= lvlFloor(L+1)) L++; return L; }
function lvlName(L){ return LEVEL_NAMES[Math.min(L, LEVEL_NAMES.length-1)]; }

function daily(p){ if(p.daily.d !== today()){ p.daily = {d:today(), needs:0, wins:0, rated:false, mood:false, focus:0, starts:0}; } return p.daily; }
function isSchoolDay(d){ var w = d.getDay(); return w !== 0 && w !== 6; }
function prevSchoolDay(d){ var x = new Date(d.getTime()); do { x.setDate(x.getDate()-1); } while(!isSchoolDay(x)); return x; }
function markDay(p){
  var t = today();
  if(p.days.indexOf(t) < 0){
    var y = prevSchoolDay(new Date()), y2 = prevSchoolDay(y);
    if(p.days.indexOf(dstr(y)) < 0 && p.days.indexOf(dstr(y2)) >= 0 && p.freezes > 0){
      p.days.push(dstr(y)); p.freezes--;
      setTimeout(function(){ toast("🧊 Ton gel a protégé ta série !"); }, 1200);
    }
    p.days.push(t); if(p.days.length > 400) p.days.shift();
  }
  var s = streak(p); if(s > p.st.ms) p.st.ms = s;
}
function streak(p){
  var d = new Date(), c = 0;
  if(p.days.indexOf(dstr(d)) >= 0) c++;
  d = prevSchoolDay(d);
  while(p.days.indexOf(dstr(d)) >= 0){ c++; d = prevSchoolDay(d); }
  return c;
}

    var seqs = {click:[[880,.04]], sel:[[620,.03]], back:[[420,.05]], ok:[[660,.07],[880,.07],[1320,.12]],
      lvl:[[523,.1],[659,.1],[784,.1],[1047,.3]], boot:[[392,.06],[784,.12]], err:[[220,.12]]};
    var seq = seqs[type] || seqs.click, t = AC.currentTime;
    for(var i=0;i<seq.length;i++){
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = "square"; o.frequency.value = seq[i][0];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.06, t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t+seq[i][1]);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+seq[i][1]+0.02);
      t += seq[i][1]*0.9;
    }
  }catch(e){}
}

/* =================== Gains =================== */
function gain(p, xp, gems, label){
  var before = level(p.xp);
  if(xp > 0 && p.dbl === today()){ xp *= 2; label = "⚡ " + (label || ""); }
  p.xp += xp; p.gems += gems;
  markDay(p);
  var parts = [];
  if(xp) parts.push("+"+xp+" XP");
  if(gems) parts.push("+"+gems+" 💎");
  if(parts.length) toast((label ? label+"  " : "")+parts.join("  "), true);
  var info = applyLevels(p, before);
  save();
  if(info){ setTimeout(function(){ levelUp(info); }, 450); }
  checkTrophies(p);
}
function applyLevels(p, before){
  var after = level(p.xp);
  if(after <= before) return null;
  var chest = 0, unl = [], ob = p.best, items = [];
  SHOP.forEach(function(it){ if(it.lv > ob && it.lv <= after) items.push(it); });
  for(var L = before+1; L <= after; L++){
    chest += chestAt(L);
    if(L > p.best) unl = unl.concat(unlocksAt(L));
  }
  p.gems += chest;
  if(after > p.best) p.best = after;
  return {from:before, to:after, chest:chest, unl:unl, items:items};
}

function chart(arr){

    poly.push(x.toFixed(1)+","+y.toFixed(1));
    dots += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="5" fill="var(--jl)"/>';
    if(i===0 || i===pts.length-1) lbl += '<text x="'+x.toFixed(1)+'" y="'+(H-2)+'" font-size="10" text-anchor="middle" fill="var(--muted)">'+fdate(r.d)+'</text>';
  });
  var grid = "";
  for(var g=1; g<=4; g++){ var gy = H - py - (g-1)/3*(H - py*2); grid += '<line x1="'+px+'" x2="'+(W-px)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--line)" stroke-dasharray="3 4"/><text x="6" y="'+(gy+4)+'" font-size="12">'+RATE_E[g]+'</text>'; }
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Évolution de la compétence">'+grid+
    '<polyline points="'+poly.join(" ")+'" fill="none" stroke="var(--jr)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+dots+lbl+'</svg>';
}

      '<p><b>Besoins les plus demandés :</b> '+(counts.length ? counts.slice(0,4).map(function(c){ return esc(c.n.t)+" ("+c.c+")"; }).join(", ") : "aucun pour l’instant")+'</p>'+
      '<p style="margin-bottom:0"><b>Autopositionnement actuel :</b><br>'+SKILLS.map(function(s){ var v = lastRate(p, s.id); return esc(s.t)+" : "+(v ? RATES[v] : "—"); }).join("<br>")+'</p></div>';
    if(p.wins.length){
      h += '<h2>Dernières victoires notées</h2><div class="list">';
      p.wins.slice(-3).reverse().forEach(function(w){ h += '<div class="save"><span class="dt">'+fdate(w.d)+'</span><span style="flex:1">'+esc(w.t)+'</span></div>'; });
      h += '</div>';
    }
  }
  var si = seasonInfo(), mode = S.teacher.seasonMode;
  h += '<h2>Saisons</h2><div class="card"><p style="margin-top:0">Saison en cours : <b>'+esc(si.label)+'</b>'+(si.left !== null ? ', encore '+si.left+' jour(s)' : '')+'.</p>'+
    '<div class="seg">'+[["trimestre","Trimestres"],["semestre","Semestres"],["manuel","Manuel"]].map(function(o){ return '<button class="'+(mode===o[0]?'sel':'')+'" data-a="smode" data-v="'+o[0]+'">'+o[1]+'</button>'; }).join("")+'</div>'+
    '<p class="note">En fin de saison, le niveau de chaque élève repart à 1. Gemmes, trophées et éléments débloqués sont conservés, et l’élève reçoit une médaille selon son niveau final. Changer de rythme ne remet personne à zéro.</p>'+
    (mode === "manuel" ? '<button class="btn l" data-a="newseason">Lancer une nouvelle saison pour tous</button>' : '')+'</div>';
  h += '<h2>Sauvegarde et partage</h2><p class="note" style="margin-top:0">Les données restent sur cet appareil uniquement. Pour changer d’appareil, copiez la sauvegarde puis collez-la sur le nouveau.</p>'+
    '<div class="row" style="flex-wrap:wrap"><button class="btn ghost" data-a="export">Copier la sauvegarde</button><button class="btn ghost" data-a="import">Coller une sauvegarde</button></div>';
  h += '<h2>Code prof</h2><div class="row"><input class="field" id="newpin" inputmode="numeric" maxlength="4" placeholder="Nouveau code à 4 chiffres"><button class="btn ghost" data-a="setpin">Changer</button></div>';
  if(p) h += '<h2 class="danger">Zone sensible</h2><button class="btn l" data-a="delp" data-v="'+p.id+'">Supprimer le profil de '+esc(p.name)+'</button>';
  h += '<p style="margin-top:24px"><button class="btn ghost" data-a="lock">🔒 Verrouiller l’espace prof</button></p>';
  return h;
}

/* =================== Actions =================== */
function act(a, v, el){
  var p = cur();
  switch(a){
    case "boot":
      beep("boot");
      var b = document.querySelector(".boot"); if(b) b.parentNode.removeChild(b);
      screen = p ? "home" : "who"; render(); break;
    case "bg": break;
    case "close": closeModal(); beep("back"); break;
    case "say": speak(v); break;
    case "towho": newP = null; go("who"); beep("back"); break;
    case "pick": S.cur = v; checkSeason(cur()); save(); homeIdx = 0; beep("ok"); go("home"); break;
    case "newp": newP = {name:"", av:"🦊", th:"neon"}; beep("click"); go("new"); break;
    case "npav": newP.name = $("pname").value; newP.av = v; beep("sel"); render(); break;
    case "create":
      var nm = ($("pname").value || "").replace(/^\s+|\s+$/g, "");
      if(!nm){ beep("err"); toast("Écris ton prénom ou un pseudo"); $("pname").focus(); return; }
      var np = blankProfile(nm, newP.av, "neon");
      [0,1,2].forEach(function(i){ np.missions.push({id:"m"+Date.now()+i, e:SUGG[i].e, t:SUGG[i].t, last:"", count:0}); });
      S.profiles.push(np); S.cur = np.id; newP = null; markDay(np); checkSeason(np); save();
      beep("lvl"); homeIdx = 0; go("home");
      setTimeout(function(){ toast("Bienvenue "+nm+" ! Tes 3 premières missions t’attendent", true); }, 300);
      break;
    case "home": beep("back"); tUnlocked = false; pinBuf = ""; go("home"); break;
    case "go":
      if(v === "joueurs"){ beep("back"); S.cur = null; save(); go("who"); return; }
      if(v === "calme"){ S.settings.calm = !S.settings.calm; save(); beep("sel"); toast(S.settings.calm ? "🌙 Mode calme activé" : "Mode calme désactivé"); render(); return; }
      for(var ti=0; ti<TILES.length; ti++){ if(TILES[ti].id===v) homeIdx = ti; }
      beep("click"); go(v); break;
    case "gomodal": closeModal(); go(v); break;
    case "inbox":
      var msgs = p.inbox.map(function(m){ return '<div class="save"><span class="dt">'+fdate(m.d)+'</span><span style="flex:1">'+esc(m.t)+'</span></div>'; }).join("");
      p.inbox = []; save(); beep("ok");
      modal('<h2>📩 Message de ton prof</h2><div class="list">'+msgs+'</div><p><button class="btn" data-a="close">Merci !</button></p>');
      render(); break;

    case "mdone":
      var md2 = null;
      p.missions.forEach(function(m){ if(m.id===v && m.last!==today()){ m.last = today(); m.count++; p.st.m++; md2 = m; } });
      if(!md2) return;
      var df = DIFF[md2.lvl||"n"];
      beep("ok"); gain(p, df.xp, df.g, md2.lvl === "d" ? "Défi relevé, bravo !" : "Ton effort paie !"); render(); break;
    case "mdiff":
      p.missions.forEach(function(m){ if(m.id===v){ var o = ["f","n","d"], k = o.indexOf(m.lvl||"n"); m.lvl = o[(k+1)%3]; } });
      save(); beep("sel"); render(); break;
    case "gform": gForm = !gForm; render(); break;
    case "gwhen": gWhen = +v; var gt0 = $("gtitle"); var keep = gt0 ? gt0.value : ""; var ks = []; for(var gi0=0; gi0<4; gi0++){ var e0 = $("gs"+gi0); ks.push(e0 ? e0.value : ""); }
      render(); if($("gtitle")) $("gtitle").value = keep; for(var gi1=0; gi1<4; gi1++){ if($("gs"+gi1)) $("gs"+gi1).value = ks[gi1]; } break;
    case "gadd":
      var gt = ($("gtitle").value || "").replace(/^\s+|\s+$/g, ""), gsteps = [];
      for(var gi=0; gi<4; gi++){ var sv = ($("gs"+gi).value || "").replace(/^\s+|\s+$/g, ""); if(sv) gsteps.push({t:sv, done:false}); }
      if(!gt || !gsteps.length){ beep("err"); toast("Écris ton objectif et au moins une étape"); return; }
      p.goals.push({id:"g"+Date.now(), t:gt, when:GOAL_WHEN[gWhen], steps:gsteps, done:false, d:today()});
      gForm = false; save(); beep("ok"); toast("Objectif lancé ! Une étape à la fois.", true); render(); break;
    case "gstep":
      var gp = v.split("|"), goal = null;
      p.goals.forEach(function(g){ if(g.id===gp[0]) goal = g; });
      if(!goal || goal.done) return;
      var stp = goal.steps[+gp[1]]; if(!stp || stp.done) return;
      stp.done = true;
      var all = true; goal.steps.forEach(function(x){ if(!x.done) all = false; });
      if(all){ goal.done = true; goal.dd = today(); p.st.g++; beep("lvl"); gain(p, 30, 15, "Objectif atteint, quelle persévérance !"); }
      else { beep("ok"); gain(p, 8, 2, "Étape franchie !"); }
      render(); break;
    case "gdel":
      confirmBox("Retirer cet objectif ?", "Ce n’est pas grave de changer d’objectif. Tu pourras en choisir un autre.", "gdelok", v); break;
    case "gdelok":
      p.goals = p.goals.filter(function(g){ return g.id !== v; }); save(); closeModal(); render(); break;
    case "mdel":
      confirmBox("Retirer cette mission ?", "Tu pourras la rajouter plus tard.", "mdelok", v); break;
    case "mdelok":
      p.missions = p.missions.filter(function(m){ return m.id !== v; }); save(); closeModal(); render(); break;
    case "madd":
      var s = SUGG[+v]; p.missions.push({id:"m"+Date.now(), e:s.e, t:s.t, last:"", count:0}); save(); beep("sel"); render(); break;
    case "mcustom":
      var mt = ($("mcustom").value || "").replace(/^\s+|\s+$/g, "");
      if(!mt){ beep("err"); return; }
      p.missions.push({id:"m"+Date.now(), e:"🎮", t:mt, last:"", count:0}); save(); beep("sel"); render(); break;

    case "need":
      var n = NEEDS[+v]; logNeed(p, n.id); showNeed(n); break;
    case "ncustom":
      var nt = ($("ncustom").value || "").replace(/^\s+|\s+$/g, "");
      if(!nt){ beep("err"); toast("Écris d’abord ton message"); return; }
      logNeed(p, "perso"); showNeed({e:"💬", t:"Mon message", m:nt}); break;

    case "rateopen": beep("click"); rateModal(p, v); break;
    case "rate":
      var parts = v.split("|"), id = parts[0], val = +parts[1];
      var arr = p.ratings[id] || [], prevMax = 0;
      arr.forEach(function(r){ if(r.v > prevMax) prevMax = r.v; });
      if(arr.length && arr[arr.length-1].d === today()) arr[arr.length-1].v = val; else arr.push({d:today(), v:val});
      if(arr.length > 60) arr.shift();
      p.ratings[id] = arr;
      var d = daily(p), xp = 0, label = "";
      if(!d.rated){ d.rated = true; xp += 5; label = "Bien vu !"; }
      if(prevMax && val > prevMax){ p.st.up++; xp += 10; label = "Tu progresses !"; }
      beep("ok");
      if(xp) gain(p, xp, 0, label); else { markDay(p); save(); checkTrophies(p); }
      rateModal(p, id); render(); break;

    case "wpick":
      var wp2 = v.split("|"), wk = wp2[0], wi = +wp2[1], wkeep = $("wtext") ? $("wtext").value : "";
      wd[wk] = wd[wk] === wi ? -1 : wi; beep("sel"); render();
      if($("wtext")) $("wtext").value = wkeep; break;
    case "wadd":
      var wext = ($("wtext").value || "").replace(/^\s+|\s+$/g, ""), wt = winText(wext);
      if(wt.length < 3){ beep("err"); toast("Choisis au moins ce que tu as fait, ou écris quelques mots"); return; }
      wd = {w:-1, s:-1, f:-1};
      p.wins.push({d:today(), t:wt}); if(p.wins.length > 200) p.wins.shift();
      p.st.w++;
      var dw = daily(p); dw.wins = (dw.wins||0) + 1;
      beep("ok");
      if(dw.wins <= 3) gain(p, 8, 3, "Victoire sauvegardée !"); else { save(); checkTrophies(p); toast("Victoire sauvegardée !"); }
      render(); break;

    case "buy":
      var bi = item(v);
      if(!bi || p.gems < priceOf(bi) || bi.lv > p.best) return;
      confirmBox("Acheter "+bi.n+" ?", bi.e+" pour "+priceOf(bi)+" 💎", "buyok", v); break;
    case "buyok":
      var it = item(v);
      if(!it || p.gems < priceOf(it)){ closeModal(); return; }
      if(it.id === "gel"){ if(p.freezes >= 3){ closeModal(); return; } p.freezes++; }
      else if(it.id === "dbl"){ if(p.dbl === today()){ closeModal(); return; } p.dbl = today(); }
      else { if(p.owned.indexOf(it.id) >= 0){ closeModal(); return; } p.owned.push(it.id); if(petSpecies(p)) p.equip[it.cat] = it.id; }
      p.gems -= priceOf(it); p.st.r++; save(); closeModal(); beep("ok");
      toast(it.cat === "power" ? it.e+" "+it.n+" activé !" : (petSpecies(p) ? it.e+" Ton compagnon le porte déjà !" : it.e+" Rangé dans ton inventaire"), true);
      checkTrophies(p); render(); break;
    case "equip":
      var ei = item(v); if(!ei || p.owned.indexOf(v) < 0) return;
      if(!petSpecies(p)){ toast("Adopte d’abord ton compagnon"); go("compagnon"); return; }
      p.equip[ei.cat] = p.equip[ei.cat] === v ? "" : v; save(); beep("sel"); render(); break;
    case "adopt":
      var spc = null; SPECIES.forEach(function(x){ if(x.id===v) spc = x; });
      p.pet = {sp:v, name:spc.n}; save(); beep("lvl");
      toast("Bienvenue à ton compagnon !", true); render(); break;
    case "petname":
      var pn = ($("petname").value || "").replace(/^\s+|\s+$/g, "");
      if(!pn){ beep("err"); return; }
      p.pet.name = pn; save(); toast("Nom enregistré"); render(); break;
    case "pettap":
      beep("sel");
      var bub = document.querySelectorAll(".bubble"), pets = document.querySelectorAll(".pet");
      var line = petLine(p);
      for(var bi2=0; bi2<bub.length; bi2++) bub[bi2].textContent = line;
      if(S.settings.tts) speak(line);
      for(var pi=0; pi<pets.length; pi++){ pets[pi].classList.remove("hop"); void pets[pi].offsetWidth; pets[pi].classList.add("hop"); }
      break;

    case "saylead":
      var ld = document.querySelector(".content .lead"); if(ld) speak(ld.textContent); break;
    case "tm":
      var tv = v.split("|");
      if(tv[0] === "start"){ tmStart(+tv[1], "focus"); beep("ok"); toast("⏱️ C’est parti pour "+tv[1]+" minutes"); }
      else if(tv[0] === "pause"){ tmPause(); beep("sel"); }
      else { tmStop(); beep("back"); }
      render(); break;
    case "moves": closeModal(); movesModal(); break;
    case "movestart": closeModal(); tmStart(1, "move"); beep("ok"); if(screen === "focus" || screen === "home") render(); else go("focus"); break;
    case "tstart":
      var tt0 = null; TASK_TYPES.forEach(function(x){ if(x.id===v) tt0 = x; });
      p.task = {e:tt0.e, t:tt0.t, steps:tt0.s.map(function(x){ return {t:x, done:false}; }), d:today()};
      save(); beep("ok"); toast("Trois petites étapes. Commence par la première !"); render(); break;
    case "tcustom":
      var tc = ($("tcustom").value || "").replace(/^\s+|\s+$/g, "");
      if(!tc){ beep("err"); return; }
      p.task = {e:"🎯", t:tc, steps:GENERIC_STEPS.map(function(x){ return {t:x, done:false}; }), d:today()};
      save(); beep("ok"); render(); break;
    case "tstep":
      if(!p.task) return;
      var ts = p.task.steps[+v]; if(!ts || ts.done) return;
      ts.done = true;
      var tall = true; p.task.steps.forEach(function(x){ if(!x.done) tall = false; });
      var dt = daily(p);
      if(tall){
        p.st.t++; dt.starts = (dt.starts||0) + 1; beep("lvl");
        p.task = null;
        if(dt.starts <= 3) gain(p, 10, 3, "Tâche terminée : tu t’es lancé·e !"); else { markDay(p); save(); checkTrophies(p); toast("Tâche terminée !"); }
      } else {
        beep("ok");
        if((dt.starts||0) < 3) gain(p, 2, 0, "Étape faite"); else save();
      }
      render(); break;
    case "tquit": p.task = null; save(); beep("back"); toast("Pas grave, on choisit autre chose."); render(); break;
    case "rtick":
      var rv = v.split("|"), rs = routineState(p), rid = rv[0], ri = +rv[1];
      if(!rs.c[rid]) rs.c[rid] = [];
      rs.c[rid][ri] = !rs.c[rid][ri];
      var rr = null; ROUTINES.forEach(function(x){ if(x.id===rid) rr = x; });
      var full = true; rr.items.forEach(function(x, i){ if(!rs.c[rid][i]) full = false; });
      beep("sel");
      if(full && !rs.c[rid+"_ok"]){ rs.c[rid+"_ok"] = true; p.st.rt++; gain(p, 5, 2, "Routine complète !"); } else save();
      render(); break;

    case "setav":
      var av = null; AVATARS.forEach(function(x){ if(x.e===v) av = x; });
      if(av.lv > p.best){ beep("err"); toast("🔒 Se débloque au niveau "+av.lv); return; }
      p.av = v; save(); beep("sel"); render(); break;
    case "setth":
      var th = theme(v);
      if(th.lv > p.best){ beep("err"); toast("🔒 Se débloque au niveau "+th.lv); return; }
      p.th = v; save(); beep("sel"); render(); break;
    case "setfr":
    case "setwp":
      var pool = a === "setfr" ? FRAMES : WALLS, it = null;
      pool.forEach(function(x){ if(x.id===v) it = x; });
      if(!it) return;
      if(it.lv > p.best){ beep("err"); toast("🔒 Se débloque au niveau "+it.lv); return; }
      if(a === "setfr") p.fr = v; else p.wp = v;
      save(); beep("sel"); render(); break;
    case "route": showRoute = !showRoute; beep("sel"); render(); break;
    case "rename":
      var rn = ($("rename").value || "").replace(/^\s+|\s+$/g, "");
      if(!rn){ beep("err"); return; }
      p.name = rn; save(); toast("Pseudo modifié"); render(); break;

    case "mood":
      var md = daily(p), found = false;
      p.moods.forEach(function(m){ if(m.d===today()){ m.m = v; found = true; } });
      if(!found){ p.moods.push({d:today(), m:v}); if(p.moods.length > 120) p.moods.shift(); }
      beep("sel");
      if(!md.mood){ md.mood = true; gain(p, 2, 0, "Merci d’avoir partagé ta météo"); } else save();
      render(); break;

    case "set":
      var sp = v.split("|"), key = sp[0], val2 = sp[1];
      S.settings[key] = key === "size" ? +val2 : val2; save(); beep("sel"); render(); break;
    case "tog":
      S.settings[v] = !S.settings[v]; save(); beep("sel"); render(); break;

    case "pin":
      if(pinBuf.length >= 4) return;
      pinBuf += v; beep("sel");
      if(pinBuf.length === 4){
        if(pinBuf === S.teacher.pin){ tUnlocked = true; tSel = S.cur; beep("ok"); }
        else { beep("err"); toast("Code incorrect"); }
        pinBuf = "";
      }
      render(); break;
    case "pinc": pinBuf = pinBuf.slice(0, -1); render(); break;
    case "lock": tUnlocked = false; pinBuf = ""; go("home"); break;
    case "tsel": tSel = v; render(); break;
    case "tgive":
      var q = byId(tSel); if(!q) return;
      var gv = v.split("|"), msg = ($("tmsg").value || "").replace(/^\s+|\s+$/g, "");
      if(!msg && gv[0]==="0" && gv[1]==="0"){ toast("Écrivez un message"); return; }
      var txt = msg || "Bravo pour tes efforts !";
      if(+gv[0] || +gv[1]) txt += " (+"+(+gv[0] ? gv[0]+" XP" : "")+(+gv[0] && +gv[1] ? ", +" : "")+(+gv[1] ? gv[1]+" 💎" : "")+")";
      var before = level(q.xp);
      q.xp += +gv[0]; q.gems += +gv[1];
      var linfo = applyLevels(q, before);
      if(linfo) txt += " Niveau "+linfo.to+" atteint, coffre +"+linfo.chest+" 💎 !";
      q.inbox.push({d:today(), t:txt});
      save(); checkTrophies(q);
      beep("ok"); toast("Envoyé à "+q.name);
      render(); break;
    case "smode":
      S.teacher.seasonMode = v;
      var nk = seasonInfo();
      S.profiles.forEach(function(x){ x.season = nk.key; x.seasonLabel = nk.label; });
      save(); beep("sel"); toast("Rythme des saisons : "+v); render(); break;
    case "newseason":
      confirmBox("Lancer une nouvelle saison ?", "Le niveau de tous les élèves repartira à 1 à leur prochaine connexion. Ils gardent gemmes, trophées et éléments débloqués.", "newseasonok", "", true); break;
    case "newseasonok":
      S.teacher.manualN = (S.teacher.manualN || 0) + 1; save(); closeModal();
      toast("Nouvelle saison lancée"); render(); break;
    case "setpin":
      var np2 = ($("newpin").value || "");
      if(!/^\d{4}$/.test(np2)){ beep("err"); toast("Le code doit contenir 4 chiffres"); return; }
      S.teacher.pin = np2; save(); toast("Code prof modifié"); render(); break;
    case "export":
      var data = JSON.stringify(S);
      modal('<h2>Copier la sauvegarde</h2><p class="note" style="margin-top:0">Copiez tout ce texte et collez-le sur l’autre appareil (Espace prof › Coller une sauvegarde).</p>'+
        '<textarea class="field" id="exp" readonly style="min-height:160px;font-size:.75rem">'+esc(data)+'</textarea><p><button class="btn" data-a="copy">Copier</button></p>');
      break;
    case "copy":
      var ta = $("exp"); ta.focus(); ta.select();
      var done = false;
      try{ done = document.execCommand("copy"); }catch(e){}
      if(!done && navigator.clipboard){ navigator.clipboard.writeText(ta.value).then(function(){ toast("Sauvegarde copiée"); }, function(){ toast("Sélectionnez le texte et copiez-le"); }); }
      else toast(done ? "Sauvegarde copiée" : "Sélectionnez le texte et copiez-le");
      break;
    case "import":
      modal('<h2>Coller une sauvegarde</h2><p class="note" style="margin-top:0">Attention : cela remplace toutes les données de cet appareil.</p>'+
        '<textarea class="field" id="imp" style="min-height:160px;font-size:.75rem" placeholder="Collez la sauvegarde ici"></textarea><p><button class="btn l" data-a="importok">Remplacer les données</button></p>');
      break;
    case "importok":
      try{
        var o = JSON.parse($("imp").value);
        if(!o || !o.profiles || !o.teacher) throw new Error("x");
        localStorage.setItem(KEY, JSON.stringify(o));
        S = load(); checkSeason(cur()); tUnlocked = false; closeModal(); toast("Sauvegarde importée"); screen = cur() ? "home" : "who"; render();
      }catch(e){ beep("err"); toast("Ce texte n’est pas une sauvegarde Boost valide"); }
      break;
    case "delp":
      var dp = byId(v);
      confirmBox("Supprimer le profil de "+dp.name+" ?", "Toutes ses missions, victoires et progrès seront effacés de cet appareil.", "delpok", v, true); break;
    case "delpok":
      S.profiles = S.profiles.filter(function(x){ return x.id !== v; });
      if(S.cur === v){ S.cur = null; }
      tSel = S.cur; save(); closeModal(); toast("Profil supprimé");
      if(!S.cur){ tUnlocked = false; go("who"); } else render();
      break;
  }
}
function logNeed(p, id){
  p.needsLog.push({d:today(), id:id}); if(p.needsLog.length > 300) p.needsLog.shift();
  p.st.n++;
  var d = daily(p); d.needs = (d.needs||0) + 1;
  beep("ok");
  if(d.needs <= 3) gain(p, 6, 2, "Bravo d’avoir osé !"); else { markDay(p); save(); checkTrophies(p); }
}
function confirmBox(title, txt, okAction, v, danger){
  modal('<h2>'+esc(title)+'</h2><p>'+esc(txt)+'</p><p class="row"><button class="btn ghost" data-a="close">Annuler</button>'+
    '<button class="btn'+(danger?' l':'')+'" data-a="'+okAction+'" data-v="'+esc(v)+'">Confirmer</button></p>');
}

/* =================== Événements =================== */
document.addEventListener("click", function(e){
  var t = closest(e.target, "[data-a]");
  if(!t) return;
  var a = t.getAttribute("data-a");
  if(a === "bg" && e.target !== t) return;
  if(a === "bg"){ closeModal(); return; }
  if(t.disabled) return;
  act(a, t.getAttribute("data-v"), t);
});
document.addEventListener("mousedown", function(){ kbd = false; });
document.addEventListener("touchstart", function(){ kbd = false; }, {passive:true});
document.addEventListener("focusin", function(e){
  var t = closest(e.target, ".tile");
  if(t && screen === "home"){ setTile(+t.getAttribute("data-i"), false); }
});
document.addEventListener("mouseover", function(e){
  var t = closest(e.target, ".tile");
  if(t && screen === "home" && !kbd){ setTile(+t.getAttribute("data-i"), false); }
});
document.addEventListener("keydown", function(e){
  kbd = true;
  var tag = (e.target.tagName || "").toLowerCase(), typing = tag === "input" || tag === "textarea";
  if(document.querySelector(".boot") && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); act("boot"); return; }
  if(e.key === "Escape" || (!typing && (e.key === "b" || e.key === "B" || e.key === "Backspace"))){
    if($("modal").innerHTML){ closeModal(); e.preventDefault(); return; }
    if(screen === "prof" && !tUnlocked && e.key === "Backspace"){ act("pinc"); e.preventDefault(); return; }
    if(screen !== "home" && screen !== "who" && screen !== "boot" && cur()){ e.preventDefault(); act("home"); }
    return;
  }
  if(typing) return;
  if(screen === "prof" && !tUnlocked && /^[0-9]$/.test(e.key)){ act("pin", e.key); return; }
  if((e.key === "a" || e.key === "A") && document.activeElement && document.activeElement !== document.body){ document.activeElement.click(); return; }
  if(screen !== "home" || $("modal").innerHTML) return;
  var inTiles = closest(document.activeElement, "#tiles"), inR = closest(document.activeElement, "#rbtns");
  if(e.key === "ArrowRight" || e.key === "ArrowLeft"){
    var dir = e.key === "ArrowRight" ? 1 : -1;
    if(inR){
      var rb = document.querySelectorAll(".rbtn"), ri = +document.activeElement.getAttribute("data-r");
      rb[(ri + dir + rb.length) % rb.length].focus();
    } else setTile(homeIdx + dir, true);
    e.preventDefault();
  } else if(e.key === "ArrowDown" && !inR){
    document.querySelector(".rbtn").focus(); e.preventDefault();
  } else if(e.key === "ArrowUp" && inR){
    setTile(homeIdx, true); e.preventDefault();
  } else if(e.key === "ArrowDown" && inTiles === null && !inR){
    setTile(homeIdx, true); e.preventDefault();
  }
});
setInterval(function(){ var c = $("clock"); if(c) c.textContent = clockTxt(); }, 20000);

/* =================== Démarrage =================== */
S = load();
if(S.cur && !cur()) S.cur = null;
checkSeason(cur());
applySettings();
render();
})();
</script>
